[package]
rust-version = "1.97.1"
name = "isocosm-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "The embeddable Isocosm sim host: one native world, its sections, saves, founding and inspection endpoint"

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
# The library's test fixture, for product endpoint tests.
fixtures = []
# The core's Graphshell inspection endpoint (rulings 896 and 901).
endpoint = ["dep:chirograph", "dep:sceno", "dep:scenomise", "dep:graphshell-endpoint"]
# The society layer's operations (886, 893), off here so a Mesocosm crate that
# depends on the core keeps them off; the VTT and Eponym enable it through isocosm.
society = ["isocosm/society"]

[dependencies]
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7", optional = true }
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7", optional = true, features = ["stdio", "local"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7", optional = true }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7", optional = true }
isocosm = { path = "../shared/isocosm", default-features = false }
isocosm-overlay = { path = "../shared/isocosm-overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"

# A no-argument stdio endpoint for Graphshell's g4_sessions receipt (H2).
[[example]]
name = "core_endpoint"
required-features = ["endpoint", "fixtures"]

[profile.dev.package.isocosm]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Graphshell's crates name mere without www; these keep one mere source.
[patch."https://github.com/merely-made/mere.git"]
# Promoted sources shared with immutable older Mere suppliers.
hagiograph = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7" }
scenograph = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7" }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7" }
mere-curation = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7" }

[patch.crates-io]
# mere patches accesskit 0.25.1 (support/patches/accesskit); its cambium hosts
# call methods only the patched copy has, so the same copy, from mere at its pin.
accesskit = { git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }

[patch."https://www.github.com/merely-made/mere.git"]
hagiograph = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }

# mere's own pins (eidetic 34105d63, gemot 4342aed4) follow the cohort:
# the www form of each URL is the same repository under another source key.
[patch."https://github.com/merely-made/eidetic.git"]
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }

[patch."https://github.com/merely-made/gemot.git"]
gemot = { git = "https://www.github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
mooting = { git = "https://www.github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
mien = { git = "https://www.github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
moothold = { git = "https://www.github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
commons-spine = { git = "https://www.github.com/merely-made/gemot.git", rev = "8ffdc9a5bab5dcc82fe3be4bfa0e1c5d8dbbab1c" }
