[package]
rust-version = "1.97.1"
name = "isocosm-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "The Isocosm mode host: native world ownership and window bindings"

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
desktop = ["dep:cambium", "dep:cambium-rootstock", "dep:cambium-genet-winit-host", "dep:isomere"]
mesocosm = ["desktop", "dep:mesocosm-genet", "dep:mesocosm-runtime", "dep:mesocosm-views", "dep:isomere"]
# Reuse the existing native-body Section producer on the same RenderCore;
# this is a picture dependency, not Mesocosm play or VTT ruleset authority.
vtt = ["desktop", "dep:isometry-campaign", "dep:isometry-views", "dep:isomere", "dep:mesocosm-genet", "dep:mesocosm-runtime"]
eponym = ["desktop", "dep:eponym-play", "dep:eponym-client", "dep:isomere"]

[dependencies]
cambium = { git = "https://github.com/merely-made/mere.git", rev = "4d8bd7037df4f15b3b0270d54eac49b86b06edf9", optional = true }
cambium-rootstock = { git = "https://github.com/merely-made/mere.git", rev = "4d8bd7037df4f15b3b0270d54eac49b86b06edf9", optional = true }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "4d8bd7037df4f15b3b0270d54eac49b86b06edf9", optional = true }
isocosm = { path = "../shared/isocosm" }
isocosm-overlay = { path = "../shared/isocosm-overlay" }
isomere = { path = "../shared/isomere", features = ["host"], optional = true }
mesocosm-runtime = { path = "../mesocosm/crates/mesocosm-runtime", optional = true }
mesocosm-genet = { path = "../mesocosm/crates/mesocosm-genet", optional = true }
mesocosm-views = { path = "../mesocosm/crates/mesocosm-views", optional = true }
isometry-campaign = { path = "../crates/isometry-campaign", optional = true }
isometry-views = { path = "../crates/isometry-views", optional = true }
eponym-play = { path = "../eponym/crates/eponym-play", optional = true }
eponym-client = { path = "../eponym/crates/eponym-client", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"

[patch.crates-io]
muniment = { git = "https://github.com/merely-made/mere.git", rev = "4d8bd7037df4f15b3b0270d54eac49b86b06edf9" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "15713014e2e23b887360471552f75f60684f5384", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "15713014e2e23b887360471552f75f60684f5384", version = "=0.1.2" }
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "15713014e2e23b887360471552f75f60684f5384", version = "=0.14.0" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }

[profile.dev.package.isocosm]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"
