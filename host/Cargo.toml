[package]
rust-version = "1.97.1"
name = "isocosm-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "The embeddable Isocosm sim host: one native world, its sections, saves, founding and inspection endpoint"

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
# The library's test fixture, for product endpoint tests.
fixtures = []
# The core's Graphshell inspection endpoint (rulings 896 and 901).
endpoint = ["dep:chirograph", "dep:sceno", "dep:scenomise", "dep:graphshell-endpoint"]
# The society layer's operations (886, 893), off here so a Mesocosm crate that
# depends on the core keeps them off; the VTT and Eponym enable it through isocosm.
society = ["isocosm/society"]

[dependencies]
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", optional = true }
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", optional = true, features = ["stdio", "local"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", optional = true }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", optional = true }
isocosm = { path = "../shared/isocosm", default-features = false }
isocosm-overlay = { path = "../shared/isocosm-overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"

[profile.dev.package.isocosm]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Graphshell's crates name mere without www; these keep one mere source.
[patch."https://github.com/merely-made/mere.git"]
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
scenograph = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
mere-curation = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
