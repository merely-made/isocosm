[package]
rust-version = "1.97.1"
name = "isocosm-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "The Isocosm mode host: native world ownership and window bindings"

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
desktop = ["dep:cambium", "dep:cambium-rootstock", "dep:cambium-genet-winit-host", "dep:isomere"]
mesocosm = ["desktop", "dep:mesocosm-genet", "dep:mesocosm-runtime", "dep:mesocosm-views", "dep:isomere"]
# Reuse the existing native-body Section producer on the same RenderCore;
# this is a picture dependency, not Mesocosm play or VTT ruleset authority.
vtt = ["desktop", "dep:isometry-campaign", "dep:isometry-views", "dep:isomere", "dep:mesocosm-genet", "dep:mesocosm-runtime"]
eponym = ["desktop", "dep:eponym-play", "dep:eponym-client", "dep:isomere"]

[dependencies]
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", optional = true }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", optional = true }
cambium-genet-winit-host = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", optional = true }
isocosm = { path = "../shared/isocosm" }
isocosm-overlay = { path = "../shared/isocosm-overlay" }
isomere = { path = "../shared/isomere", features = ["host"], optional = true }
mesocosm-runtime = { path = "../mesocosm/crates/mesocosm-runtime", optional = true }
mesocosm-genet = { path = "../mesocosm/crates/mesocosm-genet", optional = true }
mesocosm-views = { path = "../mesocosm/crates/mesocosm-views", optional = true }
isometry-campaign = { path = "../crates/isometry-campaign", optional = true }
isometry-views = { path = "../crates/isometry-views", optional = true }
eponym-play = { path = "../eponym/crates/eponym-play", optional = true }
eponym-client = { path = "../eponym/crates/eponym-client", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"

[patch.crates-io]
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "7a8c5b8cb499f2d3b91083c2f7e38236599f98dc", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "7a8c5b8cb499f2d3b91083c2f7e38236599f98dc", version = "=0.1.2" }
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "7a8c5b8cb499f2d3b91083c2f7e38236599f98dc", version = "=0.14.0" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }

[profile.dev.package.isocosm]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Root patches are not inherited from the imported Murm suppliers.
[patch."https://github.com/merely-made/mere.git"]
