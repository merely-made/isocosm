[workspace]
members = ["."]
resolver = "2"

[package]
rust-version = "1.97.1"
name = "wing-integration"
version = "0.0.1"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Live producer-to-consumer receipts for the games wing."

[dependencies]
isocosm = { path = "../isocosm" }
isometry-campaign = { path = "../../crates/isometry-campaign" }
isometer-core = { path = "../isometer/crates/isometer-core" }
isometer-mesh = { path = "../isometer/crates/isometer-mesh" }
isocosm-host = { path = "../../host", features = ["endpoint", "fixtures"] }
isocosm-overlay = { path = "../isocosm-overlay" }
isonetry = { path = "../../crates/isonetry", default-features = false, features = ["family-net"] }
mesocosm-runtime = { path = "../../mesocosm/crates/mesocosm-runtime", features = ["endpoint"] }
eponym-play = { path = "../../eponym/crates/eponym-play", features = ["endpoint"] }
isocosm-vtt = { path = "../../crates/isocosm-vtt", features = ["endpoint"] }
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", features = ["network"] }
graphshell-native = { package = "graphshell", git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d", default-features = false, features = ["native"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
murm-replication = { package = "stickleback", git = "https://www.github.com/merely-made/mere.git", rev = "0b9b7a9b218579f1f36cc1ab05a51b2a13128f1d" }
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", rev = "b49df894635bac95823284efee6c445885eaf62a" }
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
insigne = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
notochord = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
p2panda-core = "0.7.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "io-util", "time"] }
serde_json = "1"

# Isocosm's suite runs three times faster at opt-level 1, and every workspace
# that builds it sets the same level so the shared build directory holds one
# copy (wing design record, ruling 648).
[profile.dev.package.isocosm]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Restate the publication redirects needed by the isolated integration
# workspace; patches in the repository's other Cargo workspaces do not cross
# this workspace boundary.
[patch.crates-io]
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
