[workspace]
members = ["."]
resolver = "2"

[package]
rust-version = "1.97.1"
name = "wing-integration"
version = "0.0.1"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Live producer-to-consumer receipts for the games wing."

[dependencies]
cosmograph = { path = "../cosmograph" }
isocosm-campaign = { path = "../../crates/isocosm-campaign" }
isometer-core = { path = "../isometer/crates/isometer-core" }
isometer-mesh = { path = "../isometer/crates/isometer-mesh" }
cosmograph-host = { path = "../../cosmograph-host", features = ["endpoint", "fixtures"] }
cosmograph-overlay = { path = "../cosmograph-overlay" }
isonetry = { path = "../../crates/isonetry", default-features = false, features = ["family-net"] }
mesocosm-runtime = { path = "../../mesocosm/crates/mesocosm-runtime", features = ["endpoint"] }
eponym-play = { path = "../../eponym/crates/eponym-play", features = ["endpoint"] }
isocosm-native = { path = "../../crates/isocosm-native", features = ["endpoint"] }
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381", features = ["network"] }
graphshell-native = { package = "graphshell-host", git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381", default-features = false, features = ["native"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
murm-replication = { package = "stickleback", git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
p2panda-core = "0.7.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "io-util", "time"] }
serde_json = "1"

# Cosmograph's suite runs three times faster at opt-level 1, and every workspace
# that builds it sets the same level so the shared build directory holds one
# copy (wing design record, ruling 648).
[profile.dev.package.cosmograph]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Restate the publication redirects needed by the isolated integration
# workspace; patches in the repository's other Cargo workspaces do not cross
# this workspace boundary.
[patch.crates-io]
# mere patches accesskit 0.25.1 (support/patches/accesskit); its cambium hosts
# call methods only the patched copy has, so the same copy, from mere at its pin.
accesskit = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }

