[workspace]
members = ["."]
resolver = "2"

[package]
rust-version = "1.97.1"
name = "wing-integration"
version = "0.0.1"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Live producer-to-consumer receipts for the games wing."

[dependencies]
cosmograph = { path = "../cosmograph" }
isocosm-campaign = { path = "../../crates/isocosm-campaign" }
isometer-core = { path = "../isometer/crates/isometer-core" }
isometer-mesh = { path = "../isometer/crates/isometer-mesh" }
cosmograph-host = { path = "../../cosmograph-host", features = ["endpoint", "fixtures"] }
cosmograph-overlay = { path = "../cosmograph-overlay" }
isonetry = { path = "../../crates/isonetry", default-features = false, features = ["family-net"] }
mesocosm-runtime = { path = "../../mesocosm/crates/mesocosm-runtime", features = ["endpoint"] }
eponym-play = { path = "../../eponym/crates/eponym-play", features = ["endpoint"] }
isocosm-native = { path = "../../crates/isocosm-native", features = ["endpoint"] }
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["network"] }
graphshell-native = { package = "graphshell-host", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["native"] }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
murm-replication = { package = "stickleback", git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
p2panda-core = { package = "p2mere-core", version = "0.9" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "io-util", "time"] }
serde_json = "1"

# Cosmograph's suite runs three times faster at opt-level 1, and every workspace
# that builds it sets the same level so the shared build directory holds one
# copy (wing design record, ruling 648).
[profile.dev.package.cosmograph]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Restate the publication redirects needed by the isolated integration
# workspace; patches in the repository's other Cargo workspaces do not cross
# this workspace boundary.
[patch.crates-io]
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
chartulary = { git = "http://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
eidetic = { git = "http://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
