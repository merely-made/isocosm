[workspace]
members = ["."]
resolver = "2"

[package]
rust-version = "1.97.1"
name = "wing-integration"
version = "0.0.1"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Live producer-to-consumer receipts for the games wing."

[dependencies]
cosmograph = { path = "../cosmograph" }
isocosm-campaign = { path = "../../crates/isocosm-campaign" }
isometer-core = { path = "../isometer/crates/isometer-core" }
isometer-mesh = { path = "../isometer/crates/isometer-mesh" }
cosmograph-host = { path = "../../cosmograph-host", features = ["endpoint", "fixtures"] }
cosmograph-overlay = { path = "../cosmograph-overlay" }
isonetry = { path = "../../crates/isonetry", default-features = false, features = ["family-net"] }
mesocosm-runtime = { path = "../../mesocosm/crates/mesocosm-runtime", features = ["endpoint"] }
eponym-play = { path = "../../eponym/crates/eponym-play", features = ["endpoint"] }
isocosm-native = { path = "../../crates/isocosm-native", features = ["endpoint"] }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["network"] }
graphshell-native = { package = "graphshell-host", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["native"] }
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
murm-replication = { package = "stickleback", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
p2panda-core = { package = "p2mere-core", version = "0.11" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "io-util", "time"] }
serde_json = "1"

# Cosmograph's suite runs three times faster at opt-level 1, and every workspace
# that builds it sets the same level so the shared build directory holds one
# copy (wing design record, ruling 648).
[profile.dev.package.cosmograph]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Restate the publication redirects needed by the isolated integration
# workspace; patches in the repository's other Cargo workspaces do not cross
# this workspace boundary.
[patch.crates-io]
# Lua: the family fork of piccolo, matching genet's script-engine-piccolo.
piccolo = { git = "https://github.com/merely-made/didgeridoo", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
fieldbook = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
hodograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
quadstore = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }

# Compatibility source keys for immutable suppliers published before the
# repository rename. Targets and current direct dependencies use Murm.

[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
murm-webrtc = { git = "https://github.com/merely-made/murm.git", branch = "main" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

# Published custody clients share the selected host door types.
[patch.crates-io.ostiary]
version = "0.0.1"
git = "https://github.com/merely-made/armillary.git"
branch = "main"

