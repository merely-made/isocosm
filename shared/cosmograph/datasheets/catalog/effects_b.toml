# Effects, part two: what a body does in death, in the soil and when it eats.
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[effect]]
key = "effect:fresh-carrion"
summary = "A newly dead body is good food for scavengers."
site = "death"
class = "nourish"
models = ["detritus", "predator_prey"]
accepts = ["structure", "metabolism", "lifehistory", "behaviour"]
kingdoms = ["kingdom:fauna"]
admits = ["dead:fresh"]
cost_mg = 2
analogue = "a fresh kill left by a hunter"
via = ["rule:port-admission"]

[[effect]]
key = "effect:flesh-ageing"
summary = "Dead flesh moves from good to poor to toxic with time."
site = "death"
class = "harm"
models = ["detritus"]
accepts = ["structure", "metabolism", "lifehistory", "behaviour"]
kingdoms = ["kingdom:fauna", "kingdom:micro"]
admits = ["dead:aged", "dead:toxic"]
cost_mg = 3
analogue = "a carcass in the sun"
needs = "flesh-ageing"
timing = { onset = 30, intensity = 1, duration = 200, decay = 0, stacking = "strongest" }

[[effect]]
key = "effect:toxic-litter"
