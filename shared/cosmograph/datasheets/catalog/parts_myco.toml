# Parts, kingdom myco: hand-written rows.
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[part]]
key = "part:hyphal-mat"
kingdom = "kingdom:myco"
process = "mesocosm:conduct"
shape = "part-shape:branch"
traits = ["trait:hyphal-net"]
effects = { soil = ["effect:nutrient-handout", "effect:root-turnover"], death = ["effect:rot-to-soil"] }
admits = ["dead:litter", "soil:nutrient"]
emits = ["soil:nutrient"]
models = ["detritus", "competition", "mutualism"]
analogue = "a mould's mycelium through litter"

