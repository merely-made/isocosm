# Effects, part one: what a body does by touch, and what it gives when eaten.
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[effect]]
key = "effect:shade-cast"
summary = "Takes the light before it reaches what grows below."
site = "contact"
class = "resource"
models = ["competition"]
accepts = ["structure", "metabolism"]
processes = ["fix"]
kingdoms = ["kingdom:flora"]
emits = ["shade"]
cost_mg = 3
analogue = "canopy shading a seedling"
via = ["rule:light", "rule:competition"]

[[effect]]
key = "effect:smother-mat"
summary = "Covers its patch so little else can start in it."
site = "contact"
class = "resource"
models = ["competition", "succession"]
accepts = ["structure", "lifehistory"]
processes = ["fix", "reproduce"]
kingdoms = ["kingdom:flora"]
cost_mg = 4
analogue = "a creeping mat, bindweed"
via = ["rule:competition"]

[[effect]]
key = "effect:spine-prick"
summary = "Scratches or wounds whatever pushes against it."
site = "contact"
class = "harm"
models = ["defence", "predator_prey"]
accepts = ["structure"]
processes = ["support"]
only = ["trait:spine", "trait:plated-armour"]
kingdoms = ["kingdom:flora", "kingdom:fauna"]
cost_mg = 2
analogue = "thorns scratching a browser"
needs = "harm-on-contact"

[[effect]]
key = "effect:sting"
summary = "Wounds or poisons on touch, no meal needed."
site = "contact"
class = "harm"
models = ["defence"]
accepts = ["chemistry"]
processes = ["secrete"]
only = ["trait:sting-cell", "trait:venom"]
kingdoms = ["kingdom:fauna", "kingdom:flora"]
emits = ["toxin"]
cost_mg = 4
analogue = "nettle, jellyfish"
needs = "harm-on-contact"
timing = { onset = 0, intensity = 2, duration = 12, decay = 1, stacking = "stack" }

[[effect]]
key = "effect:camouflage-hide"
