effects = { eaten = ["effect:tough-matter"], death = ["effect:slow-litter"] }
emits = ["dead:wood", "dead:litter"]
models = ["competition", "defence", "detritus", "succession"]
analogue = "a tree trunk: height that wins light, wood few mouths can take"

