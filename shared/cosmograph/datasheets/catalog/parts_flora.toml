# Parts, kingdom flora: hand-written rows. (The generator adds trait x effect rows.)
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[part]]
key = "part:tannin-leaf"
kingdom = "kingdom:flora"
process = "mesocosm:fix"
shape = "part-shape:sheet"
traits = ["trait:broad-leaf", "trait:tannin"]
effects = { contact = ["effect:shade-cast"], eaten = ["effect:toxin-bite"], death = ["effect:toxic-litter"] }
admits = ["light"]
emits = ["shade", "toxin"]
models = ["competition", "defence", "detritus"]
analogue = "an oak leaf: wide, bitter, slow to rot"

[[part]]
key = "part:thorn-stem"
kingdom = "kingdom:flora"
process = "mesocosm:support"
shape = "part-shape:rod"
traits = ["trait:spine", "trait:rigid-stem"]
effects = { contact = ["effect:spine-prick"], death = ["effect:rot-to-soil"] }
models = ["competition", "defence"]
analogue = "an acacia's thorned stem"

[[part]]
key = "part:trunk"
kingdom = "kingdom:flora"
process = "mesocosm:support"
shape = "part-shape:branch"
