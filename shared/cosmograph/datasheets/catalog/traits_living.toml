# Traits, part three: metabolism and behaviour.
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[trait]]
key = "trait:c4-fixation"
summary = "A way of fixing carbon that wins in strong light and heat."
category = "metabolism"
process = "mesocosm:fix"
shape = "part-shape:sheet"
kingdoms = ["kingdom:flora"]
models = ["competition"]
sites = ["contact", "death"]
admits = ["light", "water"]
cost_mg = 11
reads = ["income", "climate", "upkeep"]
analogue = "maize, sugar cane"
via = ["function:fix", "rule:climate"]

[[trait]]
key = "trait:shade-tolerance"
summary = "A leaf that makes do where others starve of light."
category = "metabolism"
process = "mesocosm:fix"
