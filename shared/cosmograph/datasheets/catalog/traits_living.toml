kingdoms = ["kingdom:flora"]
models = ["competition", "succession"]
sites = ["contact", "death"]
admits = ["light"]
cost_mg = 9
reads = ["income", "climate", "light-share", "upkeep"]
analogue = "forest-floor fern, a beech seedling"
via = ["function:fix", "rule:climate"]

