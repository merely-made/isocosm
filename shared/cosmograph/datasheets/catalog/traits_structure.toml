# Traits, part one: structure (what a part is made to be).
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[trait]]
key = "trait:broad-leaf"
summary = "A wide leaf that wins light and shades what grows under it."
category = "structure"
process = "mesocosm:fix"
shape = "part-shape:sheet"
kingdoms = ["kingdom:flora"]
models = ["competition", "succession"]
sites = ["contact", "death"]
admits = ["light"]
emits = ["shade"]
cost_mg = 14
reads = ["income", "light-share", "upkeep", "decay"]
analogue = "oak or maple leaf, a broad frond"
via = ["function:fix", "rule:light"]

