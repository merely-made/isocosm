# Traits, part four: life history and partnership.
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[trait]]
key = "trait:wind-seed"
summary = "Seeds or spores that ride air to a neighbouring site."
category = "lifehistory"
process = "mesocosm:reproduce"
shape = "part-shape:lump"
kingdoms = ["kingdom:flora", "kingdom:myco"]
models = ["succession"]
sites = ["death", "soil"]
emits = ["seed"]
cost_mg = 8
reads = ["reproduction", "upkeep", "ceiling"]
analogue = "maple samara, dandelion, a puffball"
via = ["function:reproduce", "kind:birth"]

