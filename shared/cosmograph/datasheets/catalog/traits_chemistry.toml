# Traits, part two: chemistry (what a part makes).
#
# PROVISIONAL, a prototype (mesocosm lineage_rounds_plan D37, D38). Every key
# here is a plain working word, not a player-facing name; a naming round is
# the owner's. Not read by founding, generation or the tick.

schema = 1
owner = "cosmograph catalog"
consumer = "cosmograph::catalog (read only; nothing in the sim reads it yet)"
status = "provisional"

[[trait]]
key = "trait:alkaloid"
summary = "A bitter poison that sickens an ordinary mouth that eats it."
category = "chemistry"
process = "mesocosm:secrete"
shape = "part-shape:sheet"
kingdoms = ["kingdom:flora", "kingdom:myco"]
models = ["defence"]
sites = ["eaten", "death", "soil"]
emits = ["toxin"]
cost_mg = 10
reads = ["harm", "upkeep", "decay", "meal"]
analogue = "nightshade, ergot"
via = ["function:secrete"]
strengths = [{ kind = "toxin", role = "attack", amount = 3 }]

