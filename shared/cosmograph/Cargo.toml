[package]
rust-version = "1.97.1"
name = "cosmograph"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Deterministic world processes, populations, records and generated histories"
repository = "https://github.com/merely-made/isocosm"
publish = false

[workspace]

[features]
# The society layer's operations (wing design record, rulings 886 and 893): its commands,
# effects and processing. State fields stay in every build, so one save format is read.
default = ["society"]
society = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
wing-impresa = { package = "impresa", git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
wing-glyphs = { path = "../wing-glyphs" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
isometer-core = { path = "../isometer/crates/isometer-core", version = "0.1.0" }
# In-site space: the lift, edits and places (wing rulings 696, 698 and 701).
isometer-space = { path = "../isometer/crates/isometer-space" }
# The labelled witness, built once in mere (wing rulings 609, 647, 650).
state-witness = { git = "https://www.github.com/merely-made/mere.git", rev = "f673d313d09e6c7a043779e8c172a53f76e328a7" }
wing-functions = { path = "../wing-functions" }
wing-formats = { path = "../wing-formats" }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Cosmograph's suite runs three times faster at opt-level 1, and every workspace
# that builds it sets the same level so the shared build directory holds one
# copy (wing design record, ruling 648).
[profile.dev.package.cosmograph]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

[patch.crates-io]
# mere patches accesskit 0.25.1 (support/patches/accesskit); its cambium hosts
# call methods only the patched copy has, so the same copy, from mere at its pin.
accesskit = { git = "https://www.github.com/merely-made/mere.git", rev = "f673d313d09e6c7a043779e8c172a53f76e328a7" }
# Promoted sources shared with immutable older Mere suppliers.
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }

[patch."https://github.com/merely-made/mere.git"]
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }

distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }


[patch."https://www.github.com/merely-made/mere.git"]
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }

# Keep canonical Eidetic and Gemot requests on the selected supplier commits;
# the www URL spellings refer to the same repositories under separate keys.
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }


[patch."https://github.com/merely-made/eidetic.git"]
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1014cf48e1882ff926b55f3509ac3dbf5a5aec8e" }

[patch."https://github.com/merely-made/gemot.git"]
gemot = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
mooting = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
mien = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
moothold = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
commons-spine = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

[patch."https://github.com/merely-made/distillery.git"]
esp = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }
esp-testkit = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "66108581b3d2ca66eb42a282eccc8ec5d4039e4e" }
