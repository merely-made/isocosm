[package]
rust-version = "1.97.1"
name = "wing-decisions"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The wing's decisions as linked structure: manifest, register, journal, lookup and anchor check"
repository = "https://github.com/merely-made/isocosm"
publish = false

[workspace]

[dependencies]
wing-impresa = { path = "../wing-impresa" }
# The family cohort's rev, as mesocosm pins it.
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e", default-features = false, features = ["json", "directory"] }
pollster = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
debug = false

[dev-dependencies]
serde_json = "1"
