[package]
rust-version = "1.97.1"
name = "wing-glyphs"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Validated glyph canons and individual acquisition journeys"
repository = "https://github.com/merely-made/isocosm"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.package]
rust-version = "1.97.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
