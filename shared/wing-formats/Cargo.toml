[package]
rust-version = "1.97.1"
name = "wing-formats"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Versioned primitive interchange formats for the games wing."
repository = "https://github.com/merely-made/isocosm"
publish = false

[workspace]
members = ["."]
resolver = "2"

[dependencies]
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[workspace.package]
rust-version = "1.97.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
