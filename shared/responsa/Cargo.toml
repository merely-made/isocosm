[package]
rust-version = "1.97.1"
name = "responsa-run"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Runs eidetic's responsa on this repository's eidetic pin, for the pre-commit hook and by hand"
repository = "https://github.com/merely-made/isocosm"
publish = false

[workspace]

[[bin]]
name = "responsa"
path = "src/main.rs"

[dependencies]
# The family cohort's rev, as every eidetic pin in this repository.
responsa = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }

[profile.release]
debug = false
