[package]
rust-version = "1.97.1"
name = "wing-functions"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
repository = "https://github.com/merely-made/isocosm"
description = "Bounded, deterministic functional networks for body-part consumers."

[workspace]
members = ["."]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[workspace.package]
rust-version = "1.97.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
