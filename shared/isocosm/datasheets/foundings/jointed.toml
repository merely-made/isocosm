# The third visible-body roster: separated leaves and jointed limbs.
#
# These programs remain ordinary recipes. The extra links are realized by the
# same developmental graph, have their own mass, and sever with their parent.
#
# A chain is a tagma's explicit serial appendage chain: each step grows one
# part of `role`, of `shape` in that role's bank, extending `facing` from the
# step before; a `distal` step continues from the far end of its parent link.
# A body whose tagmata name no chain keeps the layout-only representation.

schema = 1
owner = "isocosm"
consumer = "isocosm world genesis (Founding)"
status = "authored"

[sources.phenotype]
doc = "mesocosm/design_docs/2026-07-31_phenotype_plan.md"
note = "VB2 appendage chains, 2026-09-04: paid chains for jointed legs and stalked leaves"

[sources.wing_record]
doc = "mesocosm/design_docs/2026-09-18_wing_design_plan.md"
note = "rulings 625 to 631: foundings as data, embedded, named, by roster set"

# The base palette plus two directional limb links. It changes only the
# jointed founding route; existing worlds keep their recorded palettes.
[palettes.jointed]
extends = "base"

[[palettes.jointed.plate]]
# The jointed shrub uses its own leaf proportion. The slot is local to this
# admitted palette, so it cannot reinterpret a historical content ref.
replaces = "blade"
name = "leaf"
tag = 15
half_extent = [3, 0, 2]

[[palettes.jointed.limb]]
# The lower leg link, standing upright under the upper.
name = "upright_leg"
tag = 13
half_extent = [1, 3, 1]

[[palettes.jointed.limb]]
name = "foot"
tag = 14
half_extent = [1, 1, 3]

# A leaf held up on its own paid stalk.
[[chain.leaf]]
role = "mass"
shape = "slim"
facing = "above"

[[chain.leaf]]
role = "plate"
shape = "leaf"
facing = "above"

# Upper, lower and foot links.
[[chain.leg]]
role = "limb"
shape = "leg"
facing = "outward"

[[chain.leg]]
role = "limb"
shape = "upright_leg"
facing = "below"
distal = true

[[chain.leg]]
role = "limb"
shape = "foot"
facing = "front"
distal = true

# A branched producer with each leaf held on a paid, face-connected stalk.
# The leaves remain sparse on their branch tips, so the silhouette has gaps
# rather than one merged green surface.
[body.producer_shrub]
variance = 1

[[body.producer_shrub.tagma]]
segments = 5
layout = { anchor = "tip", facing = "above", variance = 1 }

[[body.producer_shrub.tagma]]
# The lateral runs are structure. Only their fixed terminal segments bear
# leaves, keeping each blade apart at its real branch tip.
segments = 3
segment = "slim"
layout = { parent = 0, anchor = "middle", facing = "left" }

[[body.producer_shrub.tagma]]
segments = 1
segment = "slim"
appendage = "plate"
shape = "leaf"
chain = "leaf"
layout = { parent = 1, anchor = "tip", facing = "above", variance = 0 }

[[body.producer_shrub.tagma]]
segments = 3
segment = "slim"
layout = { parent = 0, anchor = "tip", facing = "right" }

[[body.producer_shrub.tagma]]
segments = 1
segment = "slim"
appendage = "plate"
shape = "leaf"
chain = "leaf"
layout = { parent = 3, anchor = "tip", facing = "above", variance = 0 }

[[body.producer_shrub.tagma]]
segments = 2
segment = "slim"
layout = { parent = 0, anchor = "tip", facing = "above" }

[[body.producer_shrub.tagma]]
segments = 1
segment = "slim"
appendage = "plate"
shape = "leaf"
chain = "leaf"
layout = { parent = 5, anchor = "tip", facing = "above", variance = 0 }

# A grazer whose three pairs of legs each have upper, lower and foot links:
# the branching browser, with every leg-bearing stretch grown in feet and
# given the leg chain.
[body.consumer_browser]
variance = 0

[[body.consumer_browser.tagma]]
segments = 1
segment = "slim"
appendage = "mouth"
shape = "crop"
layout = { anchor = "tip", facing = "back" }

[[body.consumer_browser.tagma]]
segments = 1
segment = "slim"
appendage = "feeler"
shape = "eye"
layout = { parent = 0, anchor = "base", facing = "above" }

[[body.consumer_browser.tagma]]
segments = 1
segment = "slim"
appendage = "feeler"
shape = "speck"
layout = { parent = 1, anchor = "tip", facing = "above" }

[[body.consumer_browser.tagma]]
segments = 1
segment = "slim"
layout = { parent = 0, anchor = "base", facing = "back" }

[[body.consumer_browser.tagma]]
segments = 2
segment = "slim"
layout = { parent = 3, anchor = "tip", facing = "below", variance = 1 }

[[body.consumer_browser.tagma]]
segments = 1
segment = "broad"
appendage = "limb"
shape = "foot"
chain = "leg"
layout = { anchor = "tip", facing = "back" }

[[body.consumer_browser.tagma]]
segments = 1
layout = { anchor = "tip", facing = "back" }

[[body.consumer_browser.tagma]]
segments = 2
segment = "broad"
appendage = "limb"
shape = "foot"
chain = "leg"
layout = { anchor = "tip", facing = "back" }

[[body.consumer_browser.tagma]]
segments = 4
segment = "slim"
layout = { anchor = "tip", facing = "back", variance = 1 }

# A low armoured grazer. Its two leg-bearing stretches branch from the front
# and rear of the shell run, rather than stacking under one body location.
#
# Variance 0. The leg locations are authored; only the trailing bare run
# varies, matching the prior arranged armoured recipe.
[body.consumer_armoured]
variance = 0

[[body.consumer_armoured.tagma]]
segments = 1
segment = "slim"
appendage = "mouth"
shape = "crop"
layout = { anchor = "tip", facing = "back" }

[[body.consumer_armoured.tagma]]
segments = 1
segment = "slim"
appendage = "feeler"
shape = "eye"
layout = { parent = 0, anchor = "base", facing = "above" }

[[body.consumer_armoured.tagma]]
segments = 5
appendage = "plate"
shape = "shell"
worn = "covering"
layout = { parent = 0, anchor = "base", facing = "back" }

[[body.consumer_armoured.tagma]]
segments = 1
segment = "broad"
appendage = "limb"
shape = "foot"
chain = "leg"
layout = { parent = 2, anchor = "base", facing = "below" }

[[body.consumer_armoured.tagma]]
segments = 1
segment = "broad"
appendage = "limb"
shape = "foot"
chain = "leg"
layout = { parent = 2, anchor = "tip", facing = "below" }

[[body.consumer_armoured.tagma]]
segments = 3
segment = "slim"
layout = { parent = 2, anchor = "tip", facing = "back", variance = 1 }
