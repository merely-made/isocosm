# The tiers a place reads as, by its living residents (cases 1025 and 1027;
# doctrine World 10). A place below the first threshold reads as no tier.
#
# PROVISIONAL. Case 1025 sets these "from measured draws, not guessed", and
# no draw has yet grown a sapient population to measure: these numbers hold
# the place of that measurement and nothing more. Replace them, and this
# status, when the population model's draws are receipted.

schema = 1
owner = "isocosm"
consumer = "isocosm social ladder readings (PlaceReading.tier)"
status = "provisional"

[residents_from]
hamlet = 1
town = 100
city = 5000
