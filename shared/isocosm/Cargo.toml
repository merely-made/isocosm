[package]
name = "isocosm"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Deterministic world processes, populations, records and generated histories"
repository = "https://github.com/merely-made/isocosm"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
wing-impresa = { path = "../wing-impresa" }
wing-glyphs = { path = "../wing-glyphs" }
wing-functions = { path = "../wing-functions" }
hagiograph = { git = "https://github.com/merely-made/mere.git", rev = "32edc2ad8b8a670febf9fb45d9a11bfeedb1ac3b" }
