[package]
name = "isometer"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The wing's shared orthographic slab scene: one camera, one cut, one depth, and the product-neutral body inputs that feed them."
repository = "https://github.com/merely-made/isocosm"
publish = false

# Its own workspace, like the other `shared/` path crates, and excluded from
# the Isometry root workspace beside them. The root pins mere at a different
# revision, so pulling this crate into it would fork the cambium family.
[workspace]
members = [".", "crates/*"]
resolver = "2"

[dependencies]
# Body documents, part ids, content addresses and brick ground, from the
# family's own floor. **Never `World`**: the whole point of this crate is that
# a product world does not appear in its graph, and since the core split there
# is no product crate left in it at all.
isometer-core = { path = "crates/isometer-core" }
# The projection seam: `VolumeSource`, `VolumeMap`, `Volume`. A member of this
# workspace since the move, beside the core.
isometer-mesh = { path = "crates/isometer-mesh" }
# The tracer's camera and its standing wall. A member of this workspace since
# the move, beside the core, the mesh and the renderer.
isometer-lens = { path = "crates/isometer-lens" }
# The body renderer's world cut interval, instance draw and part queries. A
# member of this workspace since the move, beside the core and the mesh.
isometer-render = { path = "crates/isometer-render" }
# The document leaf seam: `TextureProducer`, `ProducedTexture` and the two
# output-contract enums. Pinned at the revision both products pin.
cambium-rootstock = { git = "https://github.com/merely-made/mere.git", rev = "bdc89a0531273bdb4fdb2480268724e358655098" }
# The device the body layer owns its depth attachment on. Backends are left to
# the leaf binaries, as the presentation plan's dependency table rules.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
# The frame receipt is serialized by the hosts' bench and receipts lanes.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
pollster = "0.4"
# The host render core a `ProducerContext` carries, at the sources
# cambium-rootstock resolves, so the test's core is the host's own type.
genet-render-host = { git = "https://github.com/merely-made/genet.git", rev = "15713014e2e23b887360471552f75f60684f5384" }
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "9607d16f1907f6c2085648ae96abcaa30d7c3d41" }
# The GPU receipts are this crate's own leaf: `default-features = false` above
# turns every backend off, and an instance with no backend panics at
# construction rather than reporting a missing adapter. Naming them here keeps
# them out of the library a product links and out of that product's own
# backend choice.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "vulkan",
    "metal",
    "gles",
    "webgpu",
] }

# `[patch]` applies only from a workspace root and is not inherited through a
# path dependency, so this crate restates what its consumers already declare in
# order to build standalone. Consumed by path from a product workspace, the
# product's own identical patch table is the one that applies.
[patch.crates-io]
# Stable CubeCL, with Mere's persistence opt-out for resident GPU consumers.
cubecl-runtime = { git = "https://github.com/merely-made/mere.git", rev = "bdc89a0531273bdb4fdb2480268724e358655098" }
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }
# No parley or fontique row: genet published its forks as `genet-parley` and
# `genet-fontique` at 5ae30cad, so genet.git answers to neither name.
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "15713014e2e23b887360471552f75f60684f5384", version = "=0.14.0" }

# Isocosm's suite runs three times faster at opt-level 1, and every workspace
# that builds it sets the same level so the shared build directory holds one
# copy (wing design record, ruling 648).
[profile.dev.package.isocosm]
opt-level = 1
