[package]
name = "isometer-lens"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "The biosphere lens probe: a fullscreen heightfield raymarch plus a parametric grade stage. Terrain in, two souls out."
repository = "https://github.com/merely-made/isometry"
publish = false

[features]
default = []
resident-ground-receipt = ["dep:burn", "conatus/resident"]

# The probe for the unified-raymarch candidate (render lane landscape §7).
# Everything it consumes is 2D data: a heightmap, a colormap, a grade block.
# If this earns its keep it dies into a netrender render-graph task; it never
# grows into a second custom pipeline.
#
# The mere and netrender git rows are restated here at the family's own pin
# (`cambium-rootstock` in the workspace root), and wgpu, serde and postcard in
# full, because this workspace carries no central table. The specs below are
# byte-identical to the ones mesocosm declares, so the feature request and the
# revision the resolver sees do not move with the crate.
[dependencies]
modulus = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# Body documents and brick ground, from the family floor. The lens names no
# product type in production code.
isometer-core = { path = "../isometer-core" }
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "vulkan",
    "metal",
    "gles",
    "webgpu",
] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std", "wgpu"], optional = true }
conatus = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
png = "0.17"
# Tests and examples still raise a Mesocosm world to trace: `Places::grown`,
# `develop_body` and the archetype fixtures have no family equivalent, and
# generation stays Mesocosm's (family plan §4 ruling). Production code names
# nothing from it.
mesocosm-core = { path = "../../../../mesocosm/crates/mesocosm-core" }
isometer-mesh = { path = "../isometer-mesh" }
isometer-render = { path = "../isometer-render" }
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "3961aca919f707ab09a786379eb4ce8bb121258e" }
serde_json = "1"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window"] }

[[example]]
name = "resident_ground"
required-features = ["resident-ground-receipt"]
