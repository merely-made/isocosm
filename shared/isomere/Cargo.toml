[package]
rust-version = "1.97.1"
name = "isomere"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The wing's GUI layer: the shared stylesheet, palette derivation and host chrome the three products already agreed on, promoted once and consumed back."
repository = "https://github.com/merely-made/isocosm"
publish = false

# Its own workspace, like `shared/isometer` and the other `shared/` path
# crates, and excluded from the Isocosm root workspace beside them, so each
# product resolves its own graph. The root is on the same mere revision this
# crate is, which is what lets `isocosm-genet` name the host types at all; an
# earlier note here claimed otherwise and was wrong (corrected 2026-09-15).
[workspace]

[features]
default = []
# M4's host assembly. Off by default: `cambium-desktop` drags wgpu,
# netrender and winit in, and `isocosm-views` / `mesocosm-views` consume this
# crate only to emit elements. The three hosts turn it on; the view crates
# never pay for a renderer.
host = ["dep:cambium-desktop", "dep:cambium-rootstock", "dep:mesquite"]

[dependencies]
# The widget vocabulary the panels are written in. M0 uses none of it, but the
# crate's whole reason to exist is the tiers above the sheet, and the family
# revision is fixed here once rather than per milestone.
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
# Perceptual seed-to-palette derivation. The sheet's colours are `Seeds` a
# product hand-picked plus the states tinct fills.
tinct = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }

# M4: the host assembly's substrate. The seven hooks, the producer registry and
# the frame readback are the winit host's; `RootView` and the context types are
# rootstock's, which the winit host uses privately rather than re-exports;
# `mesquite` is the scenario lane wired into two of the seven hooks, and its
# `write_png` is the wing's one PNG encoder. All three behind `host`.
cambium-desktop = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907", optional = true }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907", optional = true }
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907", optional = true }

# Deliberately nothing from `shared/isometer`: isomere never names a voxel and
# never names a scene. A viewport card holds a leaf key, not a body.

# `[patch]` applies only from a workspace root and is not inherited through a
# path dependency, so this crate restates what its consumers already declare in
# order to build standalone. Consumed by path from a product workspace, the
# product's own identical patch table is the one that applies.
[patch.crates-io]
# mere patches accesskit 0.25.1 (support/patches/accesskit); its cambium hosts
# call methods only the patched copy has, so the same copy, from mere at its pin.
accesskit = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }
# No parley or fontique row: genet published its forks as `genet-parley` and
# `genet-fontique` at 5ae30cad, so genet.git answers to neither name.
# No taffy row: Livery and Buckram select the published genet-taffy 0.16, as
# mere's manifest says at the pinned rev.

[workspace.package]
rust-version = "1.97.1"

# Root patches are not inherited from the imported Murm suppliers.
[patch."https://github.com/merely-made/mere.git"]
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
cambium-desktop = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
mere-surface-api = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
cambium-winit = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
cambium-a11y = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
meristem = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
tinct = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }
workbench = { git = "https://www.github.com/merely-made/mere.git", rev = "8b8caefe3a9e87479f66e136989a9bc37d259907" }

# Keep canonical Eidetic and Gemot requests on the selected supplier commits;
# the www URL spellings refer to the same repositories under separate keys.
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "3e97257215969fb856de9c57a3158c6609ed4e6f" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "3e97257215969fb856de9c57a3158c6609ed4e6f" }


[patch."https://github.com/merely-made/eidetic.git"]
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }

[patch."https://github.com/merely-made/gemot.git"]
gemot = { git = "https://www.github.com/merely-made/gemot.git", rev = "c9e5ebfd11167e051133bd27166f3290fc2f5331" }
mooting = { git = "https://www.github.com/merely-made/gemot.git", rev = "c9e5ebfd11167e051133bd27166f3290fc2f5331" }
mien = { git = "https://www.github.com/merely-made/gemot.git", rev = "c9e5ebfd11167e051133bd27166f3290fc2f5331" }
moothold = { git = "https://www.github.com/merely-made/gemot.git", rev = "c9e5ebfd11167e051133bd27166f3290fc2f5331" }
commons-spine = { git = "https://www.github.com/merely-made/gemot.git", rev = "c9e5ebfd11167e051133bd27166f3290fc2f5331" }

# Keep the actor and apparatus-core on one published Armillary source
# identity when the Mere graph requests the canonical GitHub URL.
[patch."https://github.com/merely-made/armillary.git"]
armillary = { git = "https://www.github.com/merely-made/armillary.git", rev = "7eebeeb4447c5dfa70b813e64dc5b492a6212d3d" }
apparatus-core = { git = "https://www.github.com/merely-made/armillary.git", rev = "06340b08327b29c3485ecb0089bb5cafed20fd80" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

[patch."https://github.com/merely-made/distillery.git"]
esp = { git = "https://www.github.com/merely-made/distillery.git", rev = "3e97257215969fb856de9c57a3158c6609ed4e6f" }
esp-testkit = { git = "https://www.github.com/merely-made/distillery.git", rev = "3e97257215969fb856de9c57a3158c6609ed4e6f" }
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "3e97257215969fb856de9c57a3158c6609ed4e6f" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "3e97257215969fb856de9c57a3158c6609ed4e6f" }
