[package]
rust-version = "1.97.1"
name = "isomere"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The wing's GUI layer: the shared stylesheet, palette derivation and host chrome the three products already agreed on, promoted once and consumed back."
repository = "https://github.com/merely-made/isocosm"
publish = false

# Its own workspace, like `shared/isometer` and the other `shared/` path
# crates, and excluded from the Isocosm root workspace beside them, so each
# product resolves its own graph. The root is on the same mere revision this
# crate is, which is what lets `isocosm-genet` name the host types at all; an
# earlier note here claimed otherwise and was wrong (corrected 2026-09-15).
[workspace]

[features]
default = []
# M4's host assembly. Off by default: `cambium-desktop` drags wgpu,
# netrender and winit in, and `isocosm-views` / `mesocosm-views` consume this
# crate only to emit elements. The three hosts turn it on; the view crates
# never pay for a renderer.
host = ["dep:cambium-desktop", "dep:cambium-rootstock", "dep:mesquite"]

[dependencies]
# The widget vocabulary the panels are written in. M0 uses none of it, but the
# crate's whole reason to exist is the tiers above the sheet, and the family
# revision is fixed here once rather than per milestone.
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
# Perceptual seed-to-palette derivation. The sheet's colours are `Seeds` a
# product hand-picked plus the states tinct fills.
tinct = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }

# M4: the host assembly's substrate. The seven hooks, the producer registry and
# the frame readback are the winit host's; `RootView` and the context types are
# rootstock's, which the winit host uses privately rather than re-exports;
# `mesquite` is the scenario lane wired into two of the seven hooks, and its
# `write_png` is the wing's one PNG encoder. All three behind `host`.
cambium-desktop = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381", optional = true }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381", optional = true }
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381", optional = true }

# Deliberately nothing from `shared/isometer`: isomere never names a voxel and
# never names a scene. A viewport card holds a leaf key, not a body.

# `[patch]` applies only from a workspace root and is not inherited through a
# path dependency, so this crate restates what its consumers already declare in
# order to build standalone. Consumed by path from a product workspace, the
# product's own identical patch table is the one that applies.
[patch.crates-io]
# mere patches accesskit 0.25.1 (support/patches/accesskit); its cambium hosts
# call methods only the patched copy has, so the same copy, from mere at its pin.
accesskit = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }
# No parley or fontique row: genet published its forks as `genet-parley` and
# `genet-fontique` at 5ae30cad, so genet.git answers to neither name.
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.14.0" }

[workspace.package]
rust-version = "1.97.1"

# Root patches are not inherited from the imported Murm suppliers.
[patch."https://github.com/merely-made/mere.git"]
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
cambium-desktop = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
mere-surface-api = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
cambium-winit = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
cambium-a11y = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
meristem = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
tinct = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }
workbench = { git = "https://www.github.com/merely-made/mere.git", rev = "b232631f3e5ef30d24b19b3e832ddf225177c381" }

