[package]
name = "paredros-client"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Paredros native client: rendering, input, inspection surfaces, and retained S0 room probes."
repository = "https://github.com/merely-made/isometry"
publish = false

[lib]
name = "paredros_client"
path = "src/lib.rs"

[features]
# The shared traversal is a permanent compile-time product organ. `ROOM_R1`
# selects it at runtime for the historical R1 receipt; ordinary room rendering
# can still select the Renderling tenant.
default = ["r1-proof"]
r1-proof = ["dep:modulus", "dep:isometer-lens", "dep:serde_json"]
# V1 keeps the R1 traversal receipt and adds Paredros-owned camera and
# residency policy over a larger exact Ground working set.
v1-proof = ["r1-proof"]
# D1 joins the brick raymarch and the renderling raster tenant on one depth
# surface, so each occludes the other per pixel.
d1-proof = ["r1-proof"]
# V1b holds the V1 travel trace over one capacity-fixed brick cache with
# per-brick publication and allocator-observed bytes.
v1b-proof = ["v1-proof"]

# Path deps rather than git, because the probe's whole point is to consume the
# sibling crates as they stand on this machine: mesocosm's near-tier
# kinematics, netrender's frame, and the local renderling fork (which has no
# published home). Revisit when the probe grows into a shipped target.
[dependencies]
paredros-identity = { path = "../paredros-identity" }
paredros-world = { path = "../paredros-world" }
wing-functions = { path = "../../../shared/wing-functions" }
netrender_text = { workspace = true }
modulus = { workspace = true, optional = true }
isometer-core = { path = "../../../shared/isometer/crates/isometer-core" }
mesocosm-core = { version = "0.0.1", path = "../../../mesocosm/crates/mesocosm-core" }
isometer-lens = { version = "0.0.1", path = "../../../shared/isometer/crates/isometer-lens", optional = true }
isometer-mesh = { version = "0.0.1", path = "../../../shared/isometer/crates/isometer-mesh" }
isometer-render = { version = "0.0.1", path = "../../../shared/isometer/crates/isometer-render" }
netrender = { workspace = true }
# P1/P2 document-host lane deps: the Cambium host, its producer seam, the
# scenario driver, and the paint-list path netrender rasterizes.
cambium = { workspace = true }
cambium-rootstock = { workspace = true }
cambium-genet-winit-host = { workspace = true }
taproot = { workspace = true }
# P3b: the promoted scenario lane, now mere's `mesquite` (2026-09-14) rather
# than this repository's `shared/wing-scenario`, through the workspace pin as
# mesocosm-genet takes it.
mesquite = { workspace = true }
# The wing's shared orthographic slab scene, extracted from Mesocosm's section.
# A sibling path crate under the repository's `shared/`; its cambium-rootstock
# pin is this workspace's own.
isometer = { path = "../../../shared/isometer" }
paint_list_api = { workspace = true }
paint_list_render = { workspace = true }
renderling = { path = "../../../../../crates/renderling/crates/renderling" }
wgpu = { version = "30", default-features = false, features = [
    "dx12",
    "vulkan",
    "metal",
    "wgsl",
] }
winit = "0.30"
pollster = "0.4"
png = "0.17"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", optional = true }

[[bin]]
name = "crossing"
path = "src/bin/crossing.rs"
required-features = ["r1-proof"]

[[bin]]
name = "body_sheet"
path = "src/bin/body_sheet.rs"

[[bin]]
name = "timed_action"
path = "src/bin/timed_action.rs"

# The P2 document host. `session` is a working name; the real one is a later
# naming round. Gated on `r1-proof` because the scene producer is.
[[bin]]
name = "session"
path = "src/bin/session.rs"
required-features = ["r1-proof"]

[[bin]]
name = "v1_residency"
path = "src/bin/v1_residency.rs"
required-features = ["v1-proof"]

[[bin]]
name = "d1_depth"
path = "src/bin/d1_depth.rs"
required-features = ["d1-proof"]

[[bin]]
name = "v1b_residency"
path = "src/bin/v1b_residency.rs"
required-features = ["v1b-proof"]
