# Ars Magica Fifth Edition creation records for the first slice (case 1063):
# magus and grog, Houses Flambeau and Bonisagus, the fifteen Arts, eight
# Characteristics, the Quick and Easy Virtues and Flaws, and the Abilities
# they reach. Summaries are original; numbers and names follow the reviewed
# Definitive core, blob f2e07311e5d5db317a79b3abdea50dd81e010998 in
# OriginalMadman/Ars-Magica-Open-License, read as a check.
# Based on the material for Ars Magica, copyright 1993-2024, licensed by
# Trident, Inc. d/b/a Atlas Games, under CC BY-SA 4.0.
version = 1

[rules]
characteristic_points = 7
characteristic_costs = { "-3" = -6, "-2" = -3, "-1" = -1, "0" = 0, "1" = 1, "2" = 3, "3" = 6 }
native_language_xp = 75
childhood_xp = 45
childhood_years = 5
later_life_xp_per_year = 15
apprenticeship_years = 15
apprenticeship_xp = 240
apprenticeship_spell_levels = 120
virtue_points_max = 10
grog_minor_max = 3
magus_minimums = { parma-magica = 1, magic-theory = 1, dead-language = 1 }
# The highest Ability score at creation by age: (under this age, cap).
ability_caps = [[30, 5], [36, 6], [41, 7], [46, 8], [999, 9]]
magus_ages = [25, 30, 35]
grog_ages = [20, 25, 30, 35]
affinity_cap_bonus = 2

