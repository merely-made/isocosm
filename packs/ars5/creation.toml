# A House's benefit is a free Virtue on one of the listed targets.
[[house]]
id = "flambeau"
name = "Flambeau"
summary = "A societas of martial magi, masters of fire and destruction."
benefit = "puissant-art"
targets = ["perdo", "ignem"]
[[house]]
id = "bonisagus"
name = "Bonisagus"
summary = "A true lineage split between researchers and politicians."
benefit = "puissant-ability"
targets = ["magic-theory", "intrigue"]

# weight: free, minor (1 point) or major (3). kind follows the book's types.
# `target` names what the Virtue or Flaw is taken for; `opens` lets creation
# buy an Ability type; `pool` adds bonus experience restricted to Abilities.
[[virtue]]
id = "the-gift"
name = "The Gift"
weight = "free"
kind = "special"
summary = "The ability to work magic; every magus has it."
for = ["magus"]
automatic = true
[[virtue]]
id = "hermetic-magus"
name = "Hermetic Magus"
weight = "free"
kind = "social-status"
summary = "Membership of the Order of Hermes; the social status of every magus and no one else."
for = ["magus"]
automatic = true
[[virtue]]
id = "covenfolk"
name = "Covenfolk"
weight = "free"
kind = "social-status"
summary = "One of the covenant's staff, kept by its resources."
for = ["grog"]
automatic = true
[[virtue]]
id = "warrior"
name = "Warrior"
weight = "minor"
kind = "general"
summary = "Trained to fight: Martial Abilities open at creation, with 50 bonus experience for them."
for = ["magus", "grog"]
opens = "martial"
pool = { xp = 50, kinds = ["martial"] }
[[virtue]]
id = "educated"
name = "Educated"
weight = "minor"
kind = "general"
summary = "Schooled: Academic Abilities open at creation, with 50 bonus experience for Latin and Artes Liberales."
for = ["magus", "grog"]
opens = "academic"
pool = { xp = 50, abilities = ["dead-language", "artes-liberales"] }
[[virtue]]
id = "arcane-lore"
name = "Arcane Lore"
weight = "minor"
kind = "general"
summary = "Arcane Abilities open at creation, with 50 bonus experience for them; Parma Magica needs The Gift."
for = ["magus", "grog"]
opens = "arcane"
pool = { xp = 50, kinds = ["arcane"] }
[[virtue]]
id = "well-traveled"
name = "Well-Traveled"
weight = "minor"
kind = "general"
summary = "At ease across the region: 50 bonus experience for living languages, Area Lore, Charm, Folk Ken or Guile."
for = ["magus", "grog"]
pool = { xp = 50, abilities = ["living-language", "area-lore", "charm", "folk-ken", "guile"] }
[[virtue]]
id = "puissant-ability"
name = "Puissant Ability"
weight = "minor"
kind = "general"
summary = "Adds 2 to one Ability whenever it is used, not when it is learned or taught."
for = ["magus", "grog"]
target = "ability"
repeatable = true
[[virtue]]
id = "affinity-with-ability"
name = "Affinity with Ability"
weight = "minor"
kind = "general"
summary = "Experience put into one Ability counts half again, rounded up; its creation cap rises by 2."
for = ["magus", "grog"]
target = "ability"
repeatable = true
[[virtue]]
id = "gossip"
name = "Gossip"
weight = "minor"
kind = "general"
summary = "Hears local news early on a simple roll of 6 or more and counts local Reputations double."
for = ["magus", "grog"]
[[virtue]]
id = "piercing-gaze"
name = "Piercing Gaze"
weight = "minor"
kind = "general"
summary = "A stare that unsettles the guilty; +3 to intimidation rolls."
for = ["magus", "grog"]
[[virtue]]
id = "social-contacts"
name = "Social Contacts"
weight = "minor"
kind = "general"
summary = "Acquaintances in one social circle; somewhere new, a Presence simple roll against 6 finds one."
for = ["magus", "grog"]
[[virtue]]
id = "venus-blessing"
name = "Venus' Blessing"
weight = "minor"
kind = "general"
summary = "Attractive: +3 to Communication and Presence rolls where that matters."
for = ["magus", "grog"]
[[virtue]]
id = "puissant-art"
name = "Puissant Art"
weight = "minor"
kind = "hermetic"
summary = "Adds 3 to one Art in every total it enters, not when learning or teaching it."
for = ["magus"]
target = "art"
repeatable = true
max = 2
[[virtue]]
id = "affinity-with-art"
name = "Affinity with Art"
weight = "minor"
kind = "hermetic"
summary = "Experience put into one Art counts half again, rounded up."
for = ["magus"]
target = "art"
repeatable = true
max = 2
[[virtue]]
id = "minor-magical-focus"
name = "Minor Magical Focus"
weight = "minor"
kind = "hermetic"
summary = "Magic attuned to a narrow field: within it, the lower Art counts twice."
for = ["magus"]
refused = "a focus's field is a storyguide's ruling, which this table cannot record yet"

[[flaw]]
id = "deficient-form"
name = "Deficient Form"
weight = "minor"
kind = "hermetic"
summary = "Totals that add one Form, casting and lab work among them, are halved; Magic Resistance is not."
for = ["magus"]
target = "form"
[[flaw]]
id = "driven"
name = "Driven"
weight = "either"
kind = "personality"
summary = "Pursues one goal at nearly any cost."
for = ["magus", "grog"]
[[flaw]]
id = "proud"
name = "Proud"
weight = "either"
kind = "personality"
summary = "Quick to take offence and slow to back down."
for = ["magus", "grog"]
[[flaw]]
id = "reckless"
name = "Reckless"
weight = "either"
kind = "personality"
summary = "Acts first and weighs the danger afterwards."
for = ["magus", "grog"]
[[flaw]]
id = "covenant-upbringing"
name = "Covenant Upbringing"
weight = "minor"
kind = "personality"
summary = "Raised among magi and their staff, and ill at ease outside."
for = ["magus", "grog"]
[[flaw]]
id = "enemies"
name = "Enemies"
weight = "major"
kind = "story"
summary = "Someone powerful wants the character harmed."
for = ["magus"]
[[flaw]]
id = "dark-secret"
name = "Dark Secret"
weight = "major"
kind = "story"
summary = "Hides something that would ruin the character if known."
for = ["magus"]

