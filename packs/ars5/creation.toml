[step]
type = "Ars Magica characters are magi, members of the Order of Hermes who work magic, or grogs, the covenant's minor characters. This slice builds those two; companions come later."
house = "Every magus belongs to a House of Hermes. Each House gives its members a free Virtue at creation."
house-benefit = "Choose what your House's free Virtue applies to."
virtue = "Take Virtues and Flaws. Minor ones are worth 1 point, Major 3. Magi may take up to 10 points of Flaws and as many points of Virtues; grogs only Minor ones, up to 3 of each, and no Story Flaws. Virtue points may not exceed Flaw points."
target = "Choose what this Virtue or Flaw is taken for."
weight = "This Flaw can be taken as Minor (1 point) or Major (3 points)."
characteristic = "Buy each Characteristic from 7 points: +1 costs 1, +2 costs 3, +3 costs 6; a negative score gives points back the same way."
age = "The troupe decides starting ages. A magus has five years of childhood and fifteen of apprenticeship behind him; each other year before apprenticeship gives 15 experience points."
childhood = "Early childhood: 45 experience points among the Abilities anyone picks up growing up. Your native Living Language already has 75 (a score of 5)."
later-life = "Later life: 15 experience points a year, in any Ability your Virtues let you learn."
bonus = "Spend this Virtue's bonus experience on the Abilities it names."
apprenticeship = "Apprenticeship: 240 experience points for Arts and Abilities, Arcane, Academic and Martial ones included."
spell = "Learn spells worth up to 120 levels in all. A spell's level may not exceed its Technique plus Form plus Intelligence plus Magic Theory plus 3."
finish = "Every step is done. Finishing records the character as a sheet. A magus needs at least Parma Magica 1, Magic Theory 1 and Latin 1 to be admitted to the Order."
