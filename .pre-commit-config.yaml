# house hooks --regen --local hooks.local.yaml
# Written by `house hooks` (eidetic, crates/house); `house hooks --check` fails when this file drifts from it.
# `house` is on the PATH: cargo install --git https://github.com/merely-made/eidetic house
fail_fast: true
default_install_hook_types: [pre-commit, post-commit, pre-push]
# Hooks without stages run at pre-commit only, so the notes push inside
# `house resolved push` reruns nothing but that hook.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: house line-ceiling
        language: system
        types: [text]
        always_run: true
      - id: decisions-regen
        name: decisions regen
        entry: house decisions regen --stage
        language: system
        pass_filenames: false
        always_run: true
      - id: decisions
        name: decisions check
        entry: house decisions check
        language: system
        pass_filenames: false
        always_run: true
      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets
        language: system
        files: '(^|/)(Cargo\.toml|[^/]+\.rs)$'
        pass_filenames: false
      # From hooks.local.yaml:
      # This repository's own hooks; `house hooks --local hooks.local.yaml` appends them.
      - id: pack-json
        name: no hand-written JSON in a pack
        entry: "Pack files people write are TOML (data formats brief F1, ruling 624); JSON in a pack belongs under fixtures/:"
        language: fail
        files: '(^|/)packs/.*\.json$'
        exclude: '(^|/)fixtures/'
      # No Cargo.lock is tracked; what cargo resolved rides on each commit as a
      # git note under refs/notes/resolved (`house resolved show <commit>`).
      - id: record-resolved
        name: record resolved versions
        entry: house resolved record
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
      - id: push-resolved
        name: push resolved versions
        entry: house resolved push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
