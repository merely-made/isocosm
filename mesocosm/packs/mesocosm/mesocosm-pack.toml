pack = "mesocosm"
version = "0.0.2"
abi = 1
license = "MPL-2.0"
note = "All fifteen catalogue definitions ship as data; five bind to Mesocosm's native Process variants. Admission lowers the definitions to the same ruleset mesocosm-core holds natively; that equality is PD3's parity receipt. Nothing here is rule-bearing except each definition's namespace, name, expressed_by and seeding. The expression script proposes and never decides: the host prices what it asks for, lays the tissue out, and runs the one validator."
processes = [
    "processes/contract.toml",
    "processes/intake.toml",
    "processes/sense.toml",
    "processes/fix.toml",
    "processes/secrete.toml",
    "processes/adhesion.toml",
    "processes/circulate.toml",
    "processes/conduct.toml",
    "processes/excrete.toml",
    "processes/gate.toml",
    "processes/grip.toml",
    "processes/reproduce.toml",
    "processes/respire.toml",
    "processes/store.toml",
    "processes/support.toml",
]
expression = ["expression/gland.lua"]
fixtures = [
    "fixtures/gland_rich_ground.json",
    "fixtures/gland_lean_ground.json",
]

# Display forms only. These never enter the native rules or world digest.
[terms."kingdom:flora"]
label = "plant"
indefinite = "a plant"
[terms."kingdom:fauna"]
label = "animal"
indefinite = "an animal"
[terms."kingdom:myco"]
label = "fungus"
indefinite = "a fungus"
[terms."kingdom:micro"]
label = "microbe"
indefinite = "a microbe"
[terms."kingdom:world"]
label = "world-class"
indefinite = "a world-class entity"
[terms."trophic:producer"]
label = "producer"
indefinite = "a producer"
[terms."trophic:consumer"]
label = "consumer"
indefinite = "a consumer"
[terms."trophic:decomposer"]
label = "decomposer"
indefinite = "a decomposer"
[terms."intake:deadstock"]
label = "deadstock"
[terms."feeding:producer"]
verb = "fixes its own"
[terms."feeding:grazer"]
verb = "grazes"
[terms."feeding:predator"]
verb = "hunts"
[terms."feeding:omnivore"]
verb = "eats what it finds"
[terms."feeding:scavenger"]
verb = "scavenges"

# Presentation styles (cases 1178, 1182). Display only, like the terms above:
# never native rules, a save or the world digest. A tag names what it changes
# from the baseline; `display` is "srgb" (the baseline) or "neutral".
[styles.baseline]
display = "srgb"
[styles.film]
display = "neutral"

# Rules give a body a tag by kingdom, lineage or role (played, carcass or
# member); the first match wins, an omitted key matches any body, and a body
# no rule matches takes the host's --body-display default. None are active,
# so the shipped look is unchanged. For example:
# [[style_rules]]
# style = "film"
# kingdom = "kingdom:myco"
