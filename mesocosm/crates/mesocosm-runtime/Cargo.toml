[package]
name = "mesocosm-runtime"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Mesocosm's host-neutral runtime: fixed-timestep driving of the interim loop over a native Isocosm session, translating the overlay contract. No windowing, no graphics."
repository = "https://github.com/merely-made/isocosm"
publish = false

# The extraction candidate named in the body pipeline plan. It sits between
# the core and any host, and must stay free of windowing and graphics so both
# probe hosts can share it. Sharing it is also what keeps the host comparison
# honest: a difference between hosts cannot be a difference in stepping.
[dependencies]
isocosm = { workspace = true }
# The contract a host speaks; this crate translates it into native commands
# (wing ruling 686). The contract depends on nothing sim-internal.
isocosm-overlay = { path = "../../../shared/isocosm-overlay" }
# The brick ground the tactile adapter and the voxel profile read, and the
# site edits the glyph reading recognizes.
isometer-core = { workspace = true }
isometer-space = { path = "../../../shared/isometer/crates/isometer-space" }
nisus = { workspace = true }
serde = { workspace = true }
# T1 (engine review §5): the permanent product home of the Conatus tactile
# adapter. Rapier stays private inside conatus; this crate holds ids and
# arrays only, and tactile answers are advice, never record authority.
conatus = { workspace = true }

# Opt-in disposable glyph progression; the world and its saves stay unchanged.
wing-glyphs = { path = "../../../shared/wing-glyphs" }

[dev-dependencies]
serde_json = "1"
isometer-core = { workspace = true, features = ["fixtures"] }
