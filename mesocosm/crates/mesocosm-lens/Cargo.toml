[package]
name = "mesocosm-lens"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "The biosphere lens probe: a fullscreen heightfield raymarch plus a parametric grade stage. Terrain in, two souls out."
repository = "https://github.com/merely-made/isometry"
publish = false

[features]
default = []
resident-ground-receipt = ["dep:burn", "conatus/resident"]

# The probe for the unified-raymarch candidate (render lane landscape §7).
# Everything it consumes is 2D data: a heightmap, a colormap, a grade block.
# If this earns its keep it dies into a netrender render-graph task; it never
# grows into a second custom pipeline.
[dependencies]
modulus = { workspace = true }
# Body documents and brick ground, from the family floor. The lens names no
# product type in production code.
isometer-core = { workspace = true }
wgpu = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { workspace = true }
postcard = { workspace = true }
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std", "wgpu"], optional = true }
conatus = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
png = "0.17"
# Tests and examples still raise a Mesocosm world to trace: `Places::grown`,
# `develop_body` and the archetype fixtures have no family equivalent, and
# generation stays Mesocosm's (family plan §4 ruling). Production code names
# nothing from it.
mesocosm-core = { workspace = true }
isometer-mesh = { workspace = true }
mesocosm-render = { workspace = true }
netrender = { workspace = true }
serde_json = "1"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window"] }

[[example]]
name = "resident_ground"
required-features = ["resident-ground-receipt"]
