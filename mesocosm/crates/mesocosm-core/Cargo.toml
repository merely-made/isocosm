[package]
name = "mesocosm-core"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Mesocosm's deterministic simulation core: seeded world, ordered inputs, body graph with provenance, snapshots, and state hashing. No rendering, no host, no wgpu."
repository = "https://github.com/merely-made/isometry"
publish = false

# The core is deliberately dependency-light and host-free. It must build for
# any target a host might run on, so nothing here may pull in windowing,
# graphics, threading, or clocks.
[dependencies]
# The family floor: body documents, the body plan, brick ground, and the
# postcard/wire seam. Every item it owns is re-exported below at its old path.
isometer-core = { workspace = true }
wing-functions = { path = "../../../shared/wing-functions" }
# D1 (effect pack preset plan, ruled 2026-09-15): the shared effect
# declaration vocabulary, so the execution table below names it once instead
# of restating behaviour, receiver and cost locally. Pure data; wing-glyphs
# stays product-free and nothing here grants, draws or reads a Journey.
wing-glyphs = { path = "../../../shared/wing-glyphs" }
wing-formats = { path = "../../../shared/wing-formats" }
serde = { workspace = true }
postcard = { workspace = true }
muniment = { workspace = true }
nisus = { workspace = true }
hagiograph = { workspace = true }

[dev-dependencies]
serde_json = "1"
# Already a real dependency above; named again so `tests/move_pins.rs` can pin
# the shared header constants by their own names rather than by a copy.
wing-formats = { path = "../../../shared/wing-formats" }
