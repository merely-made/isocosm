[package]
rust-version = "1.97.1"
name = "parry-ground"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
isocosm = { path = "../../../../shared/isocosm", default-features = false }
isometer-core = { path = "../../../../shared/isometer/crates/isometer-core" }
serde = { version = "1", features = ["derive"] }
# The stack's collider layer (wing rulings 695, 722 to 725, 731): Rapier and
# Parry stay private inside conatus.
conatus = { git = "https://www.github.com/merely-made/mere.git", rev = "a6d44855b24de92ef060e16059cdacbe95135a19" }

[workspace.package]
rust-version = "1.97.1"

# Keep canonical Eidetic and Gemot requests on the selected supplier commits;
# the www URL spellings refer to the same repositories under separate keys.
