[package]
rust-version = "1.97.1"
name = "parry-ground"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
cosmograph = { path = "../../../../shared/cosmograph", default-features = false }
isometer-core = { path = "../../../../shared/isometer/crates/isometer-core" }
serde = { version = "1", features = ["derive"] }
# The stack's collider layer (wing rulings 695, 722 to 725, 731): Rapier and
# Parry stay private inside conatus.
conatus = { git = "https://github.com/merely-made/mere.git", branch = "main" }

[workspace.package]
rust-version = "1.97.1"

# Keep canonical Eidetic and Gemot requests on the selected supplier commits;
# the www URL spellings refer to the same repositories under separate keys.
[patch."https://github.com/merely-made/eidetic.git"]
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
