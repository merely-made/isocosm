[package]
rust-version = "1.97.1"
name = "parry-ground"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
cosmograph = { path = "../../../../shared/cosmograph", default-features = false }
isometer-core = { path = "../../../../shared/isometer/crates/isometer-core" }
serde = { version = "1", features = ["derive"] }
# The stack's collider layer (wing rulings 695, 722 to 725, 731): Rapier and
# Parry stay private inside conatus.
conatus = { git = "https://github.com/merely-made/seiche.git", branch = "main" }

[workspace.package]
rust-version = "1.97.1"

# Keep canonical Eidetic and Gemot requests on the selected supplier commits;
# the www URL spellings refer to the same repositories under separate keys.
[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

