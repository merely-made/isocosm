[package]
name = "mesocosm-mesh"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Turns a Mesocosm body document into geometry: per-part greedy voxel meshing plus rigid placement. Headless and deterministic, with no GPU dependency."
repository = "https://github.com/merely-made/isometry"
publish = false

# A projection, not a renderer. It produces quads in integer voxel space; a
# host turns those into vertex buffers, and Isometry's baker turns the same
# quads into sprites. Nothing here may depend on wgpu or a windowing stack.
[dependencies]
# Body documents, part identity, yaw, provenance and the wire seam.
isometer-core = { workspace = true }
wing-formats = { path = "../../../shared/wing-formats" }
serde = { workspace = true }
postcard = { workspace = true }
blake3 = "1.8.5"

[dev-dependencies]
# Fixtures only: `World`, `develop_body`, `Recipe`, `Soma`, `PartPalette` and
# the archetype roster are Mesocosm's development model, which stays with
# Mesocosm. Production code names nothing from it.
mesocosm-core = { workspace = true }
