# One lineage with fronds on every plant and a gland on some.
seed = 9
sites = 150
population = 384
lineages = 4
cohort_size = 2
stock_min = 8
stock_max = 10
period_max = 5
base_unit_micrometres = 1000
ecology = true
ecology_rates = "a1"
inherit = true

[bodies]
roster = true
founding = "SpacedRoster"
proportions = true
limb_scale = [1, 2]
variance = [1, 2]
absence = [12, 12]
clutch = [1, 4]
grazing = true
canopy_growth = true

[repertoire]
only = ["part:cyanide-leaf"]

[guard]
bite = 2
gland = 2
spine_harm = 2
dose = 16
toxin_cap = 4
rent_cells = 8

[body_maps."lineage:0"]
# One chance in two per founder cohort to omit the gland. Fronds always grow.
absence = [1, 2]

[body_maps."lineage:0".regions]
"region:gland" = "part:cyanide-leaf"

[body_maps."lineage:0".grammar]
# Grow two frond-bearing stem segments in both forms.
rules = [{ Repeat = { tagma = 0, by = 1 } }]

[[body_maps."lineage:0".grammar.seed]]
segments = 1
segment = "kind:block"
bears = "kind:frond"
per_segment = 1
socket = "Above"

[[body_maps."lineage:0".grammar.seed]]
segments = 1
segment = "kind:block"
parent = 0
facing = "Right"
bears = "region:gland"
per_segment = 1
socket = "Below"

[map.Grid]
shape = "shape:sphere"
width = 15
height = 10
side = 512
elevation = [0, 300]
relief = [2, 14]
sea_per_mille = 420

[played]
lineage = 1
region_sites = 4
