# What an item's `material` key draws as.
[materials]
iron = "#8c929c"
steel = "#b4bcc8"
bronze = "#b08d57"
silver = "#d8dce4"
oak = "#8a6a42"
hide = "#7a5a3c"
linen = "#cfc6a8"

# A make grade's finish: `shade` lightens (+) or darkens (-) the material,
# `accent` replaces the accent colour.
[makes.poor]
shade = -22
accent = "#5a5a5a"

[makes.common]
shade = 0

[makes.fine]
shade = 12
accent = "#d8b04a"

# What a `condition` key does: `shade` darkens, `fade` (0 to 1) pulls toward
# grey, `chip` (0 to 1) loses that share of the material's voxels, by seed.
[conditions.worn]
shade = -14
fade = 0.25

[conditions.broken]
shade = -26
fade = 0.4
chip = 0.18

