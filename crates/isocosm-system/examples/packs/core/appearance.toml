# The core pack's looks (doctrine VTT 7; rulings 1019, 1022, 1028).
#
# A token's `sprite` names one of the classes below. A class picks a layer for
# each slot and a palette; a token may override slots and palette entries, and
# whatever it does not override follows this file, so a pack that redeclares a
# layer, palette or class reskins every token still using it. All content here
# is original.
#
# Layers share one frame (`size`, x right, y up, z depth; the camera-facing
# front is z = 0). A layer is box fills `[x0, x1, y0, y1, z0, z1, index]`
# (half-open) and single `points` `[x, y, z, index]`, or a `file` relative to
# the pack root: another TOML layer or a `.vox`, whose colour slot 1 draws
# palette index 0 (the file's own colours are not used: the palette is the
# class's). Later slots draw over earlier ones; equipped items' layers last.

format = 1
size = [10, 24, 8]
slots = ["body", "hair"]

# Palette indices: 0 skin, 1 shirt, 2 trousers, 3 belt, 4 hair, 5 boots,
# 6 eyes, 7 metal, 8 grip, 9 hood.
[palettes.default]
colours = ["#f0c39b", "#cd413c", "#3c4882", "#282834", "#6e482a", "#342a28", "#1e1c22", "#aab0bc", "#604028", "#4a5a3a"]

[palettes.scavenger]
from = "default"
set = { 0 = "#b88b66", 1 = "#746945" }

[palettes.traveler]
from = "default"
set = { 0 = "#dcb38e", 1 = "#547b9e" }

[palettes.goblin]
from = "default"
set = { 0 = "#8ca56e", 1 = "#486e3c" }

[palettes.orc]
from = "default"
set = { 0 = "#788c5f", 1 = "#5c4637" }

[palettes.skeleton]
from = "default"
set = { 0 = "#e2dfd3", 1 = "#c6c2b4" }

[palettes.wolf]
from = "default"
set = { 0 = "#96969e", 1 = "#5c5c64" }

[classes.hero]
palette = "default"
layers = { body = "body:base", hair = "hair:short" }

[classes.knight]
palette = "default"
layers = { body = "body:mail", hair = "hair:crop" }

[classes.scavenger]
palette = "scavenger"
layers = { body = "body:base", hair = "hair:long" }

[classes.traveler]
palette = "traveler"
layers = { body = "body:robe", hair = "hair:short" }

[classes.goblin]
palette = "goblin"
layers = { body = "body:base", hair = "" }

[classes.orc]
palette = "orc"
layers = { body = "body:mail", hair = "hair:crop" }

[classes.skeleton]
palette = "skeleton"
layers = { body = "body:base", hair = "" }

[classes.wolf]
palette = "wolf"
layers = { body = "body:base", hair = "hair:long" }

# What the creator offers in each slot; "" is nothing.
[choices]
body = ["body:base", "body:robe", "body:mail"]
hair = ["hair:short", "hair:long", "hair:crop", "hair:hood", ""]

# Palette entries the creator offers to recolour, and the colours it offers.
[[swatches]]
index = 0
label = "skin"
colours = ["#f0c39b", "#dcb38e", "#b88b66", "#8a5a3c", "#5a3a28", "#8ca56e"]

[[swatches]]
index = 1
label = "shirt"
colours = ["#cd413c", "#547b9e", "#486e3c", "#d8b04a", "#7a4a8c", "#e8e4d8"]

[[swatches]]
index = 2
label = "trousers"
colours = ["#3c4882", "#4a3a2a", "#2e2e34", "#6a6a52", "#7a2c2c"]

[[swatches]]
index = 4
label = "hair"
colours = ["#6e482a", "#1e1a18", "#d8b04a", "#a8402a", "#c8c4bc", "#3a5a8c"]

[[swatches]]
index = 9
label = "hood"
colours = ["#4a5a3a", "#5a3a2a", "#2e3448", "#8c2c2c", "#c8c4bc"]

# Items (case 1035, 1043): a look derived from what the item is. Its sort
# (the shape) is bound from its template, or from its kind tag as `kind:<tag>`;
# its `material`, make grade and `condition` keys, when it carries them, pick
# a palette, a finish and wear from the tables below; its id seeds a pick
# among the sort's shapes and a small colour variation within `jitter`.
#
# An item layer's voxels use item colours 0 to 3: 0 its material, 1 the sort's
# secondary (grip, haft, straps), 2 its accent (the make's, else the sort's),
# 3 the sort's detail. `materials` are what the sort is made of (its variants
# walk them). A sort is authored for one `hand` (main, off or body);
# a weapon equipped in the other hand is mirrored there.

[item_sorts]
"kind:weapon" = "sword"
"kind:armor" = "padded"
"kind:shield" = "shield"
"srd5e:longsword" = "sword"
