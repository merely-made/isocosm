[package]
rust-version = "1.97.1"
name = "isonetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Isocosm-family accepted-record replication with an optional VTT session layer and transport features."

[features]
# Keep the established VTT API as the default. Family-only consumers can turn
# it off and depend on the host-owned Isocosm family without campaign storage.
default = ["vtt"]
vtt = [
    "dep:isometry-core",
    "dep:isometry-campaign",
    "dep:isocosm-vtt",
    "dep:isocosm-overlay",
    "dep:muniment",
    "dep:postcard",
    "isocosm/society",
]
iroh = ["vtt", "dep:iroh", "dep:iroh-tickets", "dep:tokio", "dep:tracing"]
campaign-p2p = [
    "vtt",
    "dep:personae",
    "dep:mooting",
    "dep:murm-replication",
    "dep:p2panda-core",
    "dep:p2panda-store",
    "dep:thiserror",
]
campaign-p2p-net = [
    "campaign-p2p",
    "dep:transport",
    "dep:p2panda-net",
    "dep:p2panda-sync",
    "dep:tokio",
]
campaign-moot = ["campaign-p2p", "dep:gemot", "dep:tokio"]
campaign-murm = ["vtt", "dep:murm", "dep:thiserror"]
family-net = [
    "dep:muniment",
    "dep:murm-replication",
    "dep:personae",
    "dep:p2panda-core",
    "dep:p2panda-store",
    "dep:p2panda-net",
    "dep:p2panda-sync",
    "dep:transport",
    "dep:tokio",
    "dep:graphshell-native",
    "dep:graphshell-endpoint",
    "dep:chirograph",
    "dep:sceno",
    "dep:insigne",
    "dep:notochord",
]

[dependencies]
isometry-core = { workspace = true, optional = true }
isometry-campaign = { workspace = true, optional = true }
isocosm-vtt = { workspace = true, optional = true, default-features = false }
isocosm = { path = "../../shared/isocosm", default-features = false }
isocosm-host = { path = "../../host" }
# The admitted native stream APIs, in graphshell-host since mere lifted
# Graphshell's serving half there (2e896a75, 2026-10-15).
graphshell-native = { package = "graphshell-host", git = "https://www.github.com/merely-made/mere.git", rev = "d20eb5555710ccba62220cf34434ca3f0ea659e7", default-features = false, features = ["native"], optional = true }
graphshell-endpoint = { workspace = true, optional = true }
chirograph = { workspace = true, optional = true }
sceno = { workspace = true, optional = true }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main", optional = true }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main", optional = true }
# The VTT's contract, whose assertions the host commits (wing ruling 795).
isocosm-overlay = { workspace = true, optional = true }
muniment = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Compact, no_std-friendly wire framing; also the byte form the portable
# log hash folds over (so convergence is std-hash-independent).
postcard = { version = "1", features = ["alloc"], optional = true }
personae = { workspace = true, optional = true }
mooting = { workspace = true, optional = true }
murm-replication = { workspace = true, optional = true }
gemot = { workspace = true, optional = true }
p2panda-core = { workspace = true, optional = true }
p2panda-net = { workspace = true, optional = true }
p2panda-store = { workspace = true, optional = true }
p2panda-sync = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
transport = { workspace = true, optional = true }
murm = { workspace = true, optional = true }

# iroh feature only. iroh 1.0 + tickets 1.0, matching mere-transport so the
# whole graph carries a single iroh (and thus a single ed25519-dalek): the
# 0.98-vs-1.0 split is what wedged the lock via incompatible dalek prereleases.
iroh = { version = "1.0", optional = true }
iroh-tickets = { version = "1.0", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "io-util", "time"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
isometry-core = { workspace = true }
isometry-system = { workspace = true }
pollster = "0.4"

[[example]]
name = "session_smoke"
required-features = ["iroh"]

[[example]]
name = "forest_session"
required-features = ["iroh"]

[[test]]
name = "native_mode_game"
required-features = ["vtt"]

[[test]]
name = "native_publication"
required-features = ["vtt"]

[[test]]
name = "native_setup"
required-features = ["vtt"]

[[test]]
name = "native_site_history"
required-features = ["vtt"]

[[test]]
name = "protocol_envelope"
required-features = ["vtt"]

[[test]]
name = "transition_resolution"
required-features = ["vtt"]
