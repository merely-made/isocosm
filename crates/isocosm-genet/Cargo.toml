[package]
rust-version = "1.97.1"
name = "isocosm-genet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Isocosm's desktop application over the shared Cambium desktop host: state, hooks, the net bridge, and the self-tests. The native host itself is genet's."

[dependencies]
isocosm-core = { workspace = true }
isocosm-campaign = { workspace = true }
isocosm-native = { workspace = true, default-features = false, features = ["endpoint"] }
cosmograph = { workspace = true }
cosmograph-host = { path = "../../cosmograph-host" }
cosmograph-overlay = { workspace = true }
isocosm-views = { workspace = true }
isonetry = { workspace = true, features = ["iroh", "family-net"] }
notochord = { workspace = true }
# Peer admission over the holder's custody identity (stack-lift D4, isocosm
# case 1060): co-op's invitation, lifted into graphshell-host, and Djinn's
# custody client that signs it. Same sources isonetry's graphshell-host uses.
graphshell-host = { git = "https://www.github.com/merely-made/mere.git", rev = "f673d313d09e6c7a043779e8c172a53f76e328a7", default-features = false, features = ["native", "custody-client"] }
castellan-client = { git = "https://github.com/merely-made/dramatis.git", branch = "main", default-features = false, features = ["client"] }
personae = { workspace = true }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
uuid = "1"
# The invited-peer transport and its signed record lane (case 1060).
transport = { workspace = true }
murm-replication = { workspace = true }
p2panda-core = { workspace = true }
# Direct endpoint contract use in the Genet-owned FamilyTable adapter.
chirograph = { workspace = true }
graphshell-endpoint = { workspace = true }
isocosm-system = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
cambium = { workspace = true }
sceno = { workspace = true }
# The shared single-root Cambium desktop host (genet G1). It owns the winit
# lifecycle, the surface, layout, paint, hit testing, input routing, IME and
# the AccessKit sync that host.rs / render.rs / input.rs used to assemble — so
# the direct deps that assembly needed (genet-layout, genet-winit,
# cambium-winit, netrender, paint_list_api, paint_list_render, wgpu, winit) are
# gone from this manifest. They still arrive transitively; reaching around the
# host to name them again would put the duplication straight back.
cambium-desktop = { workspace = true }
# M4 of the isomere plan: the wing's host assembly. `host` is off by default in
# isomere because it drags wgpu in and `isocosm-views` consumes the crate only
# to emit elements; this is the consumer that turns it on. It brought the
# bounded capture policy with it, which is why `png` is no longer named below.
isomere = { workspace = true, features = ["host"] }
sprigging = { workspace = true }
layout-dom-api = { workspace = true }
genet-scripted-dom = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
muniment = { workspace = true, features = ["redb"] }
armillary = { workspace = true }
pollster = "0.4"
ab_glyph = "0.2"

[dev-dependencies]
# Invitation tests sign as an in-memory owner; release builds never do (stack-lift D4).
graphshell-host = { git = "https://www.github.com/merely-made/mere.git", rev = "f673d313d09e6c7a043779e8c172a53f76e328a7", default-features = false, features = ["test-signer"] }
# Host-routing receipts run through `Harness`, the windowless twin of the
# shipping host: a click, a right-click, a wheel notch and a key press take the
# same hit test, capture and dispatch path the real window takes. `taproot`
# supplies the semantic selectors those tests target controls by.
taproot = { workspace = true }
# B3's scene-arm receipts draw one real frame before pressing on it, because a
# windowless harness runs no producer. That means the scene's own frame request
# and source trait, plus the backend list `isocosm-views`'s parity gate turns
# on — and only for the receipts: the binary links wgpu through the host and
# isometer through the view layer either way.
isometer = { workspace = true }
wgpu = { version = "30", default-features = false, features = [
    "std",
    "wgsl",
    "dx12",
    "vulkan",
    "metal",
    "gles",
    "webgpu",
] }

[lints]
workspace = true
