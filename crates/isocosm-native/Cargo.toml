[package]
rust-version = "1.97.1"
name = "isocosm-native"
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Cosmograph VTT game layer: native campaign founding, table actions and an optional Graphshell endpoint."
repository = "https://github.com/merely-made/isocosm"
readme = "README.md"
keywords = ["vtt", "tabletop", "isometric", "p2p", "game"]
categories = ["games"]

[features]
default = []
endpoint = ["dep:chirograph", "dep:graphshell-endpoint", "cosmograph-host/endpoint", "dep:isocosm-system", "dep:isocosm-core"]

[dependencies]
chirograph = { workspace = true, optional = true }
graphshell-endpoint = { workspace = true, optional = true, features = ["local", "stdio"] }
cosmograph = { workspace = true }
cosmograph-host = { path = "../../cosmograph-host", features = ["society"] }
cosmograph-overlay = { workspace = true }
isocosm-campaign = { workspace = true }
isocosm-core = { workspace = true, optional = true }
isocosm-system = { workspace = true, optional = true }
isometer-space = { path = "../../shared/isometer/crates/isometer-space" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
isonetry = { path = "../isonetry", version = "0.1.0", default-features = false }
cosmograph-host = { path = "../../cosmograph-host", features = ["endpoint", "society", "fixtures"] }
postcard = { workspace = true }

# A no-argument stdio endpoint for Graphshell's g4_sessions receipt (H2).
[[example]]
name = "vtt_endpoint"
required-features = ["endpoint"]

[[example]]
name = "magic_weapon_table"
required-features = ["endpoint"]

[[example]]
name = "pf2e_table"
required-features = ["endpoint"]

[[test]]
name = "endpoint"
required-features = ["endpoint"]

[[test]]
name = "family_endpoint"
required-features = ["endpoint"]
