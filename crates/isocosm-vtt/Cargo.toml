[package]
rust-version = "1.97.1"
name = "isocosm-vtt"
version = "0.0.2"
edition = "2024"
license = "MPL-2.0"
description = "Name reservation. Isocosm: VTT is the pixel-art, peer-to-peer virtual tabletop of the Isocosm family, over the Isocosm simulator; implemented by the isometry-* crates."
repository = "https://github.com/merely-made/isocosm"
readme = "README.md"
keywords = ["vtt", "tabletop", "isometric", "p2p", "game"]
categories = ["games"]

# The VTT's Graphshell endpoint over the sim-host core (rulings 900, 902, 904).
[dependencies]
chirograph = { workspace = true }
graphshell-endpoint = { workspace = true }
isocosm = { workspace = true }
isocosm-host = { path = "../../host", features = ["endpoint", "society"] }
isocosm-overlay = { workspace = true }
isometry-campaign = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
isocosm-host = { path = "../../host", features = ["endpoint", "society", "fixtures"] }
graphshell-endpoint = { workspace = true, features = ["local", "stdio"] }

# A no-argument stdio endpoint for Graphshell's g4_sessions receipt (H2).
[[example]]
name = "vtt_endpoint"
