[package]
rust-version = "1.97.1"
name = "cosmograph-host"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "The embeddable Cosmograph sim host: one native world, its sections, saves, founding and inspection endpoint"

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
# The library's test fixture, for product endpoint tests.
fixtures = []
# The core's Graphshell inspection endpoint (rulings 896 and 901).
endpoint = ["dep:chirograph", "dep:sceno", "dep:scenomise", "dep:graphshell-endpoint"]
# The society layer's operations (886, 893), off here so a Mesocosm crate that
# depends on the core keeps them off; the VTT and Eponym enable it through cosmograph.
society = ["cosmograph/society"]
# The world-graph viewer (sim host plan H9, cases 1038 and 1048): a native
# Graphshell client of the endpoint, drawn on Pictograph's board.
viewer = ["endpoint", "society", "dep:graphshell-client", "dep:graphshell-host", "dep:pictograph",
    "dep:cambium", "dep:cambium-desktop", "dep:mandrake", "dep:cambium-rootstock", "dep:taproot", "dep:netrender"]

[dependencies]
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true, features = ["stdio", "local"] }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
cosmograph = { path = "../shared/cosmograph", default-features = false }
cosmograph-overlay = { path = "../shared/cosmograph-overlay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
# The viewer's client, board and window (feature `viewer`).
graphshell-client = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
graphshell-host = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["board"], optional = true }
pictograph = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["canvas"], optional = true }
cambium = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
cambium-desktop = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
mandrake = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
cambium-rootstock = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["accesskit"], optional = true }
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main", optional = true }

# A no-argument stdio endpoint for Graphshell's g4_sessions receipt (H2).
[[example]]
name = "core_endpoint"
required-features = ["endpoint", "fixtures"]

[[bin]]
name = "world-graph-viewer"
path = "src/bin/world_graph_viewer/main.rs"
required-features = ["viewer"]

[profile.dev.package.cosmograph]
opt-level = 1

[workspace.package]
rust-version = "1.97.1"

# Graphshell's crates name mere without www; these keep one mere source.

