[workspace]
resolver = "2"
members = [
    "crates/isometry-core",
    "crates/isometry-campaign",
    "crates/isometry-graphshell",
    "crates/isometry-views",
    "crates/isometry-genet",
    "crates/isonetry",
    "crates/isometry-system",
]
exclude = ["crates/isometry-runtime", "mesocosm", "eponym", "shared/wing-functions", "shared/wing-formats", "shared/wing-integration", "shared/wing-glyphs", "shared/isometer", "shared/isomere"]

# Keep interactive debug builds responsive; see the watchtower plan's M4 drag
# receipt. Include the app where generic host/layout code is instantiated.
# Symbols and debug assertions remain enabled; only these hot packages change.
[profile.dev.package.isometry-genet]
opt-level = 2

[profile.dev.package.cambium-rootstock]
opt-level = 2

[profile.dev.package.genet-livery]
opt-level = 2

[profile.dev.package.livery]
opt-level = 2

[profile.dev.package.buckram]
opt-level = 2

[profile.dev.package.genet-taffy]
opt-level = 2

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/merely-made/isometry"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates
isometry-core = { path = "crates/isometry-core", version = "0.1.0" }
isometry-campaign = { path = "crates/isometry-campaign", version = "0.1.0" }
# The wing appearance crate: the voxel bake merged into the family mesh
# crate on 2026-09-15. It carries its own workspace, so it stays in the
# `exclude` list above and is taken by path, as wing-integration takes it.
isometer-mesh = { path = "shared/isometer/crates/isometer-mesh" }
# The family floor (brick ground, the Terrain seam) and the lens type the
# board binds its tile-kind palette through; same workspace, same path rule.
isometer-core = { path = "shared/isometer/crates/isometer-core" }
isometer-lens = { path = "shared/isometer/crates/isometer-lens" }
# The wing's shared scene itself: `Scene`, `SlabCamera`, `SceneSource` and the
# `SceneProducer` the scene board registers as a document leaf (B2). The three
# crates above are the family floor; this is the facade over them, and taking
# it by path follows the same rule they do.
isometer = { path = "shared/isometer" }
# Named only for the two `wgpu::TextureView` words in the `SceneSource`
# signature. Backends stay the leaf binary's choice, exactly as isometer's own
# manifest rules; the scene adapter's own receipts turn them on as dev deps.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
# The wing GUI layer: the shared panels and the keymap the control-help
# line is derived from. Its own workspace, so it is taken by path too.
isomere = { path = "shared/isomere" }
isometry-views = { path = "crates/isometry-views", version = "0.1.0" }
isonetry = { path = "crates/isonetry", version = "0.1.0" }
isometry-system = { path = "crates/isometry-system", version = "0.1.0" }
# Private host-side choice receipts. The committed source stays on Git; a local
# Cleromancy checkout is supplied by the machine-local source patch during
# paired development.
cleromancy = { git = "https://github.com/merely-made/cleromancy.git", rev = "9b496157c7852983f6cd2ac10e06f8b4aa59f653", default-features = false }

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"], default-features = false }
# Portable slots/blobs over a host-chosen backend. Isometry uses its redb
# backend for private desktop campaign state; the future web host can swap
# the backend without changing campaign data.
muniment = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# Host-neutral actor runtime for background host/session work. The Genet
# application owns its state on the winit thread and drains typed updates.
armillary = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
personae = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
mooting = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# Murm's peer-exchange replication foundation (SyncedSpace/MunimentStore/
# processor). Split out of `mooting` by mere's murm peer-runtime work; mooting
# now keeps only governance policy.
murm-replication = { package = "stickleback", git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
gemot = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# mere renamed the package to `mere-transport` (the lib is still `transport`),
# and `[patch]` keys match the *package* name, so both this dep and the local
# override in .cargo/tabletop-local.toml must say so.
transport = { package = "mere-transport", git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
murm = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
p2panda-core = "0.7.0"
# The net crate is `mere-p2panda-net =0.7.4`, taken exactly as
# `mere-transport` and `stickleback` take it: same package, same exact
# version, same features. It is no longer a registry edge: mere moved the
# family to the fork's `0.7.4` release (mere `0db9d10d`, "Pin mere-p2panda-net
# 0.7.4 with prompt idle sync shutdown"), and 0.7.4 was never published, so the
# `[patch.crates-io]` table below repoints this line at the fork tag. isonetry composes `LogSync` on the endpoint
# `P2pandaTransport::sync_parts` hands it, so a different dep line here lands a
# second net crate and the endpoint types stop matching. Every feature except
# `sqlite`: the address book runs on stickleback's muniment-backed store, and
# feature unification means every consumer has to opt out, not just one.
p2panda-net = { package = "mere-p2panda-net", version = "=0.7.4", default-features = false, features = [
    "address_book",
    "iroh_endpoint",
    "iroh_mdns",
    "discovery",
    "gossip",
    "sync",
] }
p2panda-store = { version = "0.7.0", default-features = false }
p2panda-sync = "0.7.0"
thiserror = "1"

# Product-free projection score and analytic solvers. Isometry owns the
# campaign-to-score adapter in `isometry-views`; the shared crates carry only
# opaque source refs, measured footprints, and scenes.
sceno = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# The projection contract. Was `graphshell-protocol`; mere renamed it to
# `chirograph` on 2026-08-14 because the contract is the family's, not the
# portal's. Same types, same re-exports.
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
graphshell-stdio = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }

# UI: the shared Cambium desktop host. Git deps on the owned repos so any
# machine resolves; local checkouts override via the gitignored
# .cargo/tabletop-local.toml source-specific [patch] entries. Cambium supplies the view
# toolkit; `cambium-genet-winit-host` supplies the whole native assembly.
# **Git, not crates.io** (Mark's ruling, 2026-07-26): the family resolves from
# the owning repo until there is an actual GitHub release to consume, and
# crates.io releases keep being cut for external consumers rather than for us.
# Isometry was the only repo still taking these from the registry, and it was
# the one carrying the hazard: published cambium/sprigging resolve
# `paint_list_api` from crates.io while this workspace git-deps netrender's, so
# `sprigging::PaintCmd` was not `paint_list_api::PaintCmd`. The gitignored
# [patch] file hid that here by redirecting sprigging to a path; a clean
# checkout would not have.
#
# **The Cambium family moved out of genet into mere on 2026-09-03.**
# `genet/components/cambium` no longer exists — cambium, cambium-rootstock,
# cambium-winit, cambium-winit-a11y, cambium-genet-winit-host, sprigging and
# meristem are mere workspace members under `crates/cambium/` now. So Cambium
# uses the same immutable Mere revision as every dependency above. Cargo keys
# a git source by URL plus reference, so keep the whole family aligned.
#
# The node-label floor the old registry pin used to state is long past —
# `with_node_labels` labels carry node state from cambium 0.3.2 on, and mere
# main is 0.3.3.
cambium = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# The single-root Cambium desktop host (genet G1, 2026-08-09; mere's since
# 2026-09-03). It owns the winit lifecycle, the surface, layout, paint, hit
# testing, input routing and the AccessKit sync isometry used to assemble by
# hand — so the direct deps that assembly needed (genet-layout,
# genet-winit-host, cambium-winit, netrender, paint_list_*, wgpu, winit) are
# gone from this workspace. They still arrive transitively; only what isometry
# may *name* changed.
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# Cambium's retained custom-paint leaves (the graph-canvas swatch's painted
# nodes + edges). A host wires them directly, the pelt-desktop pattern. From the
# same git source as cambium, which is what keeps one `PaintCmd` in the graph.
sprigging = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }

# The DOM seams that stayed in genet when Cambium left. Their revision is not
# free: mere's `cambium-genet-winit-host` takes `layout-dom-api` (as
# `layout_dom_api`), `genet-scripted-dom`, `taproot`, `genet-winit-host`
# and `genet-livery` from the owner-selected Genet revision below.
# One reference per git source, or two copies of the DOM seams land
# and the host's `LayoutDom` stops being the one isometry's views and receipts
# build. Bump this when mere's genet pin moves, and only then.
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "5ae30cad0ea421085a52dc9f86ead53028f0592d", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "5ae30cad0ea421085a52dc9f86ead53028f0592d", version = "=0.1.1" }
# The shared automatability substrate: selector resolution, so isometry's
# host-routing receipts target a control by role and label rather than pixel.
# Named `genet-probe` until genet 7baa554c (2026-09-14).
taproot = { git = "https://github.com/merely-made/genet.git", rev = "5ae30cad0ea421085a52dc9f86ead53028f0592d" }

# Mirror of the [patch.crates-io] entries this workspace's genet graph needs;
# patches are per-workspace-root and do NOT inherit through a git dep, so both
# genet's and mere's own tables have to be restated here. Every genet entry
# takes the revision the deps above take, for the same one-source-one-reference
# reason.
[patch.crates-io]
# `murm-replication` (from mere) depends on the *published* muniment, while this
# workspace tracks the repo. Two sources means two `muniment::Backend` traits and
# `MunimentStore`'s bounds stop matching, so redirect the registry edge at the
# same git source and revision: exactly one muniment lands.
muniment = { git = "https://github.com/merely-made/mere.git", rev = "876320fddd4cecddab8080d5decf2b5d8568d47e" }
# The two DOM seams again, from the registry side: published Buckram and Livery
# reach them through crates.io, and a registry copy beside the git one is the
# same two-`LayoutDom` split the workspace dep above guards against. Same
# revision as mere's Cambium consumes, necessarily.
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "5ae30cad0ea421085a52dc9f86ead53028f0592d", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "5ae30cad0ea421085a52dc9f86ead53028f0592d", version = "=0.1.1" }
# There is deliberately no `cambium` or `sprigging` entry here. Both are
# published, but nothing in this graph reaches them through the registry —
# mere's members take them by path inside mere's own checkout — so an entry
# would be a permanent "patch was not used" line.
# NO stylo / stylo_atoms / stylo_taffy patch. Genet retired Stylo and the
# incumbent layout cone on 2026-08-21 (`55c05d11`), so genet.git no longer
# provides `stylo_taffy` at any revision the family pins and the entry that
# stood here failed the whole workspace at resolution rather than just the
# Stylo lane:
#
#   error: patch location `...genet.git?branch=main` does not contain
#   packages matching `stylo_taffy`
#
# Nothing here depends on it; the entry outlived its subject. Taffy is
# different: Buckram and Livery consume the renamed `genet-taffy` package, so
# the patch below names that package explicitly while keeping the dependency
# alias Cargo expects.
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "5ae30cad0ea421085a52dc9f86ead53028f0592d", version = "=0.14.0" }
# ipc-channel: genet's in-process fork (force-inprocess default; drops the
# windows 0.61 pin that broke gpu-allocator/wgpu-hal unification).
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "5ae30cad0ea421085a52dc9f86ead53028f0592d" }
# `murm-replication` (stickleback) and `mere-transport` are written against the
# **owned p2panda fork**, not the published crates. mere's manifest repoints the
# family there; this workspace must mirror it, or it resolves stock p2panda from
# crates.io and stickleback fails to compile against it.
#
# **The family patches together or not at all.** The fork's crates path-dep each
# other, so repointing one alone lands two `p2panda-core` copies and the trait
# bounds stop matching. `p2panda-sync` is patched even though nothing but the
# net crate reaches it in mere, because this workspace declares it directly for
# isonetry's LogSync composition and would otherwise pull a registry copy.
#
# The reference is mere's, and it is the immutable release tag rather than a
# branch: a branch lets the two workspaces drift a commit apart, which is the
# same duplicate hazard by another route. Keep no local paths here; the
# machine-local redirect belongs in the gitignored `.cargo/tabletop-local.toml`.
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
# `mere-p2panda-net` joins the family here as of mere `3675a352`. It used to be
# left out because the net crate came from the registry at `=0.7.2`; mere's
# `0db9d10d` moved the family to the `0.7.4` fork release, which was never
# published, so the registry edge named in [workspace.dependencies] above has
# to be repointed at the fork or `stickleback`'s `=0.7.4` cannot resolve at all:
#
#   error: failed to select a version for the requirement
#   `mere-p2panda-net = "=0.7.4"` ... candidate versions found which didn't
#   match: 0.7.2, 0.7.1
#
# There is still deliberately no `p2panda-net` entry: that *package name* is
# consumed nowhere in the graph, so patching it would be permanently unused.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
#
# `p2panda-stream` is deliberately absent too, though mere patches it. Nothing
# here reaches it even under `--all-features` — stickleback names it as a
# dev-dependency only — so the entry would produce a permanent "patch was not
# used" warning. That matters more than it sounds: a wall of those warnings is
# what hid the whole p2panda divergence for a session. The omission is safe
# because the duplicate-copy hazard only applies to crates actually in the
# graph, and if something later pulls `p2panda-stream` from the registry the
# result is a loud trait-bound mismatch, not a silent second copy. Add it back
# at that point.

# Vello on wgpu 30. Upstream vello 0.10 still requires wgpu 29, so netrender
# (and through it this app's render path) takes vello from the owned fork:
# the v0.10.0 tag plus exactly the API changes in linebender/vello#1754.
# `[patch]` applies only from the top-level manifest and is NOT inherited
# from genet or netrender, so every app workspace restates it. Retires by
# deletion when upstream ships a wgpu-30 vello.
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }
