[workspace]
resolver = "2"
members = [
    "crates/isocosm-core",
    "crates/isocosm-campaign",
    "crates/isocosm-graphshell",
    "crates/isocosm-views",
    "crates/isocosm-genet",
    "crates/isonetry",
    "crates/isocosm-system",
    "crates/isocosm-native",
]
exclude = ["cosmograph-host", "mesocosm", "eponym", "shared/cosmograph", "shared/cosmograph-overlay", "shared/wing-functions", "shared/wing-formats", "shared/wing-integration", "shared/wing-glyphs", "shared/isometer", "shared/isomere"]

# Keep interactive debug builds responsive; see the watchtower plan's M4 drag
# receipt. Include the app where generic host/layout code is instantiated.
# Symbols and debug assertions remain enabled; only these hot packages change.
[profile.dev.package.isocosm-genet]
opt-level = 2

[profile.dev.package.cambium-rootstock]
opt-level = 2

[profile.dev.package.genet-livery]
opt-level = 2

[profile.dev.package.livery]
opt-level = 2

[profile.dev.package.buckram]
opt-level = 2

[profile.dev.package.genet-taffy]
opt-level = 2

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/merely-made/isocosm"

rust-version = "1.97.1"

[workspace.dependencies]
murm-sync = { version = ">=0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
# Internal crates
isocosm-core = { path = "crates/isocosm-core", version = "0.1.0" }
isocosm-campaign = { path = "crates/isocosm-campaign", version = "0.1.0" }
isocosm-native = { path = "crates/isocosm-native", version = "0.0.2", default-features = false }
# The sim owns accepted world state/history. VTT content and table projections
# live in isocosm-campaign; the separate sim workspace is taken by path.
cosmograph = { path = "shared/cosmograph" }
# The overlay contract; its own workspace, taken by path (wing ruling 795).
cosmograph-overlay = { path = "shared/cosmograph-overlay" }
# The wing appearance crate: the voxel bake merged into the family mesh
# crate on 2026-09-15. It carries its own workspace, so it stays in the
# `exclude` list above and is taken by path, as wing-integration takes it.
isometer-mesh = { path = "shared/isometer/crates/isometer-mesh" }
# The family floor (brick ground, the Terrain seam) and the lens type the
# board binds its tile-kind palette through; same workspace, same path rule.
isometer-core = { path = "shared/isometer/crates/isometer-core" }
isometer-lens = { path = "shared/isometer/crates/isometer-lens" }
# The wing's shared scene itself: `Scene`, `SlabCamera`, `SceneSource` and the
# `SceneProducer` the scene board registers as a document leaf (B2). The three
# crates above are the family floor; this is the facade over them, and taking
# it by path follows the same rule they do.
isometer = { path = "shared/isometer" }
# Named only for the two `wgpu::TextureView` words in the `SceneSource`
# signature. Backends stay the leaf binary's choice, exactly as isometer's own
# manifest rules; the scene adapter's own receipts turn them on as dev deps.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
# The wing GUI layer: the shared panels and the keymap the control-help
# line is derived from. Its own workspace, so it is taken by path too.
isomere = { path = "shared/isomere" }
isocosm-views = { path = "crates/isocosm-views", version = "0.1.0" }
isonetry = { path = "crates/isonetry", version = "0.1.0" }
isocosm-system = { path = "crates/isocosm-system", version = "0.1.0" }

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"], default-features = false }
# Portable slots/blobs over a host-chosen backend. Isocosm uses its redb
# backend for private desktop campaign state; the future web host can swap
# the backend without changing campaign data.
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Host-neutral actor runtime for background host/session work. The Genet
# application owns its state on the winit thread and drains typed updates.
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
mooting = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
# Murm's peer-exchange replication foundation (SyncedSpace/MunimentStore/
# processor). Split out of `mooting` by mere's murm peer-runtime work; mooting
# now keeps only governance policy.
murm-replication = { package = "stickleback", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
gemot = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
# mere renamed the package to `mere-transport` (the lib is still `transport`),
# and `[patch]` keys match the *package* name, so both this dep and the local
# override in .cargo/tabletop-local.toml must say so.
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", branch = "main" }
murm = { git = "https://github.com/merely-made/murm.git", branch = "main" }
p2panda-core = { package = "p2mere-core", version = "0.12.0" }
# Match the registry source and features used by mere-transport so LogSync can
# use its endpoint. The address book uses Stickleback's Muniment-backed store.
p2panda-net = { package = "p2mere-net", version = "0.12.0", default-features = false, features = [
    "address_book",
    "iroh_endpoint",
    "iroh_mdns",
    "discovery",
    "gossip",
    "sync",
] }
p2panda-store = { package = "p2mere-store", version = "0.12.0", default-features = false }
p2panda-sync = { package = "p2mere-sync", version = "0.12.0" }
thiserror = "2"

# Product-free projection score and analytic solvers. Isocosm owns the
# campaign-to-score adapter in `isocosm-views`; the shared crates carry only
# opaque source refs, measured footprints, and scenes.
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The endpoint and its carriers: mere folded `graphshell-stdio`, `-local` and
# `-network` into `graphshell_endpoint::{stdio, local, network}` (mere
# 0c65a9d6), each behind a feature of the same name that its user turns on.
graphshell-endpoint = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The projection contract. Was `graphshell-protocol`; mere renamed it to
# `chirograph` on 2026-08-14 because the contract is the family's, not the
# portal's. Same types, same re-exports.
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }

# UI: the shared Cambium desktop host. Git deps on the owned repos so any
# machine resolves; local checkouts override via the gitignored
# .cargo/tabletop-local.toml source-specific [patch] entries. Cambium supplies the view
# toolkit; `cambium-desktop` supplies the whole native assembly.
# **Git, not crates.io** (Mark's ruling, 2026-07-26): the family resolves from
# the owning repo until there is an actual GitHub release to consume, and
# crates.io releases keep being cut for external consumers rather than for us.
# Isocosm was the only repo still taking these from the registry, and it was
# the one carrying the hazard: published cambium/sprigging resolve
# `paint_list_api` from crates.io while this workspace git-deps netrender's, so
# `sprigging::PaintCmd` was not `paint_list_api::PaintCmd`. The gitignored
# [patch] file hid that here by redirecting sprigging to a path; a clean
# checkout would not have.
#
# **The Cambium family moved out of genet into mere on 2026-09-03.**
# `genet/components/cambium` no longer exists — cambium, cambium-rootstock,
# cambium-winit, cambium-a11y, cambium-desktop, sprigging and
# meristem are mere workspace members under `crates/cambium/` now. So Cambium
# uses the same immutable Mere revision as every dependency above. Cargo keys
# a git source by URL plus reference, so keep the whole family aligned.
#
# The node-label floor the old registry pin used to state is long past —
# `with_node_labels` labels carry node state from cambium 0.3.2 on, and mere
# main is 0.3.3.
cambium = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The single-root Cambium desktop host (genet G1, 2026-08-09; mere's since
# 2026-09-03). It owns the winit lifecycle, the surface, layout, paint, hit
# testing, input routing and the AccessKit sync Isocosm used to assemble by
# hand — so the direct deps that assembly needed (genet-layout,
# genet-winit, cambium-winit, netrender, paint_list_*, wgpu, winit) are
# gone from this workspace. They still arrive transitively; only what Isocosm
# may *name* changed.
cambium-desktop = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Cambium's retained custom-paint leaves (the graph-canvas swatch's painted
# nodes + edges). A host wires them directly, the pelt-desktop pattern. From the
# same git source as cambium, which is what keeps one `PaintCmd` in the graph.
sprigging = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }

# The DOM seams that stayed in genet when Cambium left. Their revision is not
# free: mere's `cambium-desktop` takes `layout-dom-api` (as
# `layout_dom_api`), `genet-scripted-dom`, `taproot`, `genet-winit`
# and `genet-livery` from the owner-selected Genet revision below.
# One reference per git source, or two copies of the DOM seams land
# and the host's `LayoutDom` stops being the one Isocosm's views and receipts
# build. Bump this when mere's genet pin moves, and only then.
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.2" }
# The shared automatability substrate: selector resolution, so Isocosm's
# host-routing receipts target a control by role and label rather than pixel.
# Named `genet-probe` until genet 7baa554c (2026-09-14).
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main" }

# Mirror of the [patch.crates-io] entries this workspace's genet graph needs;
# patches are per-workspace-root and do NOT inherit through a git dep, so both
# genet's and mere's own tables have to be restated here. Every genet entry
# takes the revision the deps above take, for the same one-source-one-reference
# reason.
[patch.crates-io]
# Lua: the family fork of piccolo, matching genet's script-engine-piccolo.
piccolo = { git = "https://github.com/merely-made/didgeridoo", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
fieldbook = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
hodograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
quadstore = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
gemot = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mien = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
mooting = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# `murm-replication` (from mere) depends on the *published* muniment, while this
# workspace tracks the repo. Two sources means two `muniment::Backend` traits and
# `MunimentStore`'s bounds stop matching, so redirect the registry edge at the
# same git source and revision: exactly one muniment lands.
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# The two DOM seams again, from the registry side: published Buckram and Livery
# reach them through crates.io, and a registry copy beside the git one is the
# same two-`LayoutDom` split the workspace dep above guards against. Same
# revision as mere's Cambium consumes, necessarily.
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.2" }
# house patches --from https://github.com/merely-made/mere.git
# Written by `house patches` (eidetic, crates/house) from the upstream's [patch.crates-io]; `house patches --check` fails when they drift.
oxjsonld = { git = "https://github.com/mark-ik/oxigraph", branch = "mark-ik/0.5" }
oxrdf = { git = "https://github.com/mark-ik/oxigraph", branch = "mark-ik/0.5" }
oxrdfio = { git = "https://github.com/mark-ik/oxigraph", branch = "mark-ik/0.5" }
oxrdfxml = { git = "https://github.com/mark-ik/oxigraph", branch = "mark-ik/0.5" }
oxttl = { git = "https://github.com/mark-ik/oxigraph", branch = "mark-ik/0.5" }
# end house patches
# There is deliberately no `cambium` or `sprigging` entry here. Both are
# published, but nothing in this graph reaches them through the registry —
# mere's members take them by path inside mere's own checkout — so an entry
# would be a permanent "patch was not used" line.
# NO stylo / stylo_atoms / stylo_taffy patch. Genet retired Stylo and the
# incumbent layout cone on 2026-08-21 (`55c05d11`), so genet.git no longer
# provides `stylo_taffy` at any revision the family pins and the entry that
# stood here failed the whole workspace at resolution rather than just the
# Stylo lane:
#
#   error: patch location `...genet.git?branch=main` does not contain
#   packages matching `stylo_taffy`
#
# Nothing here depends on it; the entry outlived its subject. Taffy needs no
# patch either: Livery and Buckram select the published genet-taffy 0.16
# directly, as mere's own manifest says at the pinned rev.
# Vello on wgpu 30. Upstream vello 0.10 still requires wgpu 29, so netrender
# (and through it this app's render path) takes vello from the owned fork:
# the v0.10.0 tag plus exactly the API changes in linebender/vello#1754.
# `[patch]` applies only from the top-level manifest and is NOT inherited
# from genet or netrender, so every app workspace restates it. Retires by
# deletion when upstream ships a wgpu-30 vello.

# Cosmograph's suite runs three times faster at opt-level 1, and every workspace
# that builds it sets the same level so the shared build directory holds one
# copy (wing design record, ruling 648).
[profile.dev.package.cosmograph]
opt-level = 1

# Compatibility source keys for immutable suppliers published before the
# repository rename. Targets and current direct dependencies use Murm.

[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
murm = { git = "https://github.com/merely-made/murm.git", branch = "main" }
murm-webrtc = { git = "https://github.com/merely-made/murm.git", branch = "main" }

# Keep the actor and apparatus-core on one published Armillary source
# identity when the Mere graph requests the canonical GitHub URL.

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

# Published custody clients share the selected host door types.
[patch.crates-io.ostiary]
version = "0.0.1"
git = "https://github.com/merely-made/armillary.git"
branch = "main"

