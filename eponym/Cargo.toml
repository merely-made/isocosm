[package]
rust-version = "1.97.1"
name = "eponym"
version = "0.0.2"
edition = "2024"
license = "MPL-2.0"
description = "Name reservation. Eponym is a second-person action RPG in a persistent generated world: you name one creature and live that life among peers who can outlive you and take your place."
repository = "https://github.com/merely-made/isocosm"
readme = "README.md"
keywords = ["game", "rpg", "companions", "simulation", "generated"]
categories = ["games"]
exclude = ["design_docs/"]

# Own workspace root. The reservation package plus the crates that have split
# out so far.
#
# Game and application crates use MPL-2.0. A promoted reusable library also
# stays MPL-2.0 (ruled 2026-09-03, retiring the 2026-07-31 clause that let a
# proven boundary take MIT OR Apache-2.0): see LICENSES.md.
[workspace]
members = [
    "crates/eponym-client",
    "crates/eponym-motion",
    "crates/eponym-play",
    "crates/eponym-sortie",
]

[patch.crates-io]
# mere patches accesskit 0.25.1 (support/patches/accesskit); its cambium hosts
# call methods only the patched copy has, so the same copy, from mere at its pin.
accesskit = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
# The renderer graph may resolve vello from crates.io, and
# upstream vello 0.10 still requires wgpu 29. Without this the graph carries
# two wgpu majors and netrender's vello rasterizer stops type-checking
# against this workspace's wgpu 30. Retires when a wgpu-30 vello ships.
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }
# Genet's vendored layout. `[patch]` does not inherit through a git dep, so a
# consumer of genet-livery restates it at the same genet revision the
# workspace dependencies pin (plan P0). No parley or fontique row: genet
# published its forks as `genet-parley` and `genet-fontique` at 5ae30cad, so
# genet.git answers to neither name and such a row would fail resolution;
# genet-livery reaches the fork by path inside the git checkout. No
# ipc-channel row since genet 1b62fd0b: nothing here reaches it.
# No taffy row: Livery and Buckram select the published genet-taffy 0.16, as
# mere's manifest says at the pinned rev.

# The probe builds a lot of shader and rasterizer code. Unoptimized debug
# builds render a frame slowly enough to misread as a hang.
[profile.dev]
opt-level = 1

# Renderer source is selected once for this product; use the same immutable
# family revision as the other games and their Mere/Genet host dependencies.
[workspace.dependencies]
conatus = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
modulus = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
# The lit body tenant (mere's crates/conatus/tenant, wing rulings 745 to 748).
tenant = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender_text = { git = "https://github.com/merely-made/netrender.git", branch = "main" }

# The document-host lane (P0 of the genet document host plan). Every row
# below matches Mesocosm's revision for its git family, so the graph holds
# one identity per family: cargo keys a git source by URL plus reference,
# and a second reference would be a second crate identity of one commit.
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
cambium-desktop = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
# Named `genet-probe` until genet 7baa554c (2026-09-14).
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# The scenario lane the session acceptance run is built on. It was this
# repository's `shared/wing-scenario` until mere took it into the cambium
# family as `mesquite` (mere 3675a352, 2026-09-14), so it is a mere.git pin at
# the family rev like every other cambium row above.
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
genet-livery = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", branch = "main" }

[dependencies]

[workspace.package]
rust-version = "1.97.1"

# Root patches are not inherited from the imported Murm suppliers.
[patch."https://github.com/merely-made/mere.git"]
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
cambium-desktop = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
mere-surface-api = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
cambium-winit = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
cambium-a11y = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
meristem = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
tinct = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }
workbench = { git = "https://www.github.com/merely-made/mere.git", rev = "d1055540dde6dea2fb96655375278b59ffb755ee" }

# Keep canonical Eidetic and Gemot requests on the selected supplier commits;
# the www URL spellings refer to the same repositories under separate keys.
[patch."https://github.com/merely-made/eidetic.git"]
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }

[patch."https://github.com/merely-made/gemot.git"]
gemot = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
mooting = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
mien = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
moothold = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }
commons-spine = { git = "https://www.github.com/merely-made/gemot.git", rev = "998133bc17b8636152e9c4f7605eb475498213c8" }

# Keep the actor and apparatus-core on one published Armillary source
# identity when the Mere graph requests the canonical GitHub URL.
[patch."https://github.com/merely-made/armillary.git"]
armillary = { git = "https://www.github.com/merely-made/armillary.git", rev = "7eebeeb4447c5dfa70b813e64dc5b492a6212d3d" }
apparatus-core = { git = "https://www.github.com/merely-made/armillary.git", rev = "06340b08327b29c3485ecb0089bb5cafed20fd80" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
