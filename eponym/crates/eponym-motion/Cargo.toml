[package]
name = "eponym-motion"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Eponym's motion and contact, solved on the game side over conatus (rulings 233 and 597)."
repository = "https://github.com/merely-made/isocosm"
publish = false

[dependencies]
conatus = { workspace = true }
eponym-world = { version = "0.0.1", path = "../eponym-world" }
isometer-core = { path = "../../../shared/isometer/crates/isometer-core" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
eponym-identity = { version = "0.0.1", path = "../eponym-identity" }
isocosm = { path = "../../../shared/isocosm" }
