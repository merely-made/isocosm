[package]
name = "eponym-world"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Eponym world, body, population, project, simulation, and replay systems."
repository = "https://github.com/merely-made/isocosm"
publish = false

# F0a consumes Mesocosm's current verb-neutral topology and material facts,
# while Eponym owns what those slots mean and what history does to them.
# The path dependency is product proof, not a permanent ownership ruling.
[dependencies]
wing-functions = { path = "../../../shared/wing-functions" }
wing-glyphs = { path = "../../../shared/wing-glyphs" }
isometer-core = { path = "../../../shared/isometer/crates/isometer-core" }
isocosm = { path = "../../../shared/isocosm" }
eponym-identity = { version = "0.0.1", path = "../eponym-identity" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
